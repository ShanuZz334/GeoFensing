# ==============================================================================
# Nginx Configuration - GeoFace Faculty Authentication System
# Place at: /etc/nginx/sites-available/geoface
# Symlink:  sudo ln -s /etc/nginx/sites-available/geoface /etc/nginx/sites-enabled/
# ==============================================================================

upstream geoface_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name api.geoface.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.geoface.yourdomain.com;

    # ── SSL (replace with your cert paths) ───────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/api.geoface.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.geoface.yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security Headers ─────────────────────────────────────────────────
    add_header X-Frame-Options           DENY;
    add_header X-Content-Type-Options    nosniff;
    add_header X-XSS-Protection          "1; mode=block";
    add_header Referrer-Policy           "strict-origin-when-cross-origin";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Rate Limiting ─────────────────────────────────────────────────────
    # Define zones in nginx.conf http block:
    #   limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    #   limit_req_zone $binary_remote_addr zone=verify:10m rate=20r/m;

    # ── Request size (base64 frames can be large) ─────────────────────────
    client_max_body_size 20M;
    client_body_timeout  60s;

    # ── Proxy to Gunicorn ─────────────────────────────────────────────────
    location / {
        proxy_pass         http://geoface_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }

    location /login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://geoface_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /verify {
        limit_req zone=verify burst=5 nodelay;
        proxy_pass         http://geoface_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Admin static panel ────────────────────────────────────────────────
    location /panel/ {
        alias /var/www/geoface-admin/;
        try_files $uri $uri/ /panel/index.html;
    }

    # ── Health check (no rate limit) ─────────────────────────────────────
    location /health {
        proxy_pass http://geoface_backend;
        access_log off;
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
    }
}
