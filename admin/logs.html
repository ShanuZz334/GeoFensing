      <select id="filter-action" class="filter-select" onchange="applyFilters()">
        <option value="">All actions</option>
        <option value="check_in">Check In</option>
        <option value="check_out">Check Out</option>
        <option value="who_is_in">Currently In</option>
      </select>
      <div style="display:flex;align-items:center;gap:6px;">
        <span style="font-size:12px;color:var(--text-muted);white-space:nowrap;">From</span>

      </div>
      <select id="filter-sort" class="filter-select" onchange="applyFilters()">

        <option value="teacher_name_desc">Teacher (Z-A)</option>

      <!-- Sacrificial inputs to trap browser autofill -->

        <input type="password" name="password_trap_v2">

      <input type="text" id="filter-reg-no" name="reg_no_unique_search" class="filter-input" placeholder="Search Reg No..." style="width:150px" oninput="debounceApplyFilters()" autocomplete="new-password" />

  <script>
  function togglePasswordVisibility() {
    const pw = document.getElementById('admin-password');
    const icon = document.getElementById('eye-icon');
    if (pw.type === 'password') {
      pw.type = 'text';
      icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
    } else {
      pw.type = 'password';
      icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    }
  }
  </script>

  <script src="js/api.js?v=1.2.1"></script>
  <script src="js/app.js?v=1.2.1"></script>
  <script>
    let currentPage = 1;
    let filterTimeout;
    let lastData = null;

    function applyFilters() { currentPage = 1; loadLogs(); }
    function debounceApplyFilters() {
      clearTimeout(filterTimeout);
      filterTimeout = setTimeout(applyFilters, 500);
    }
    function resetFilters() {
      document.getElementById('filter-status').value = '';
      document.getElementById('filter-action').value = '';
      document.getElementById('filter-date-from').value = '';
      document.getElementById('filter-date-to').value = '';
      document.getElementById('filter-sort').value = 'timestamp_desc';
      document.getElementById('filter-reg-no').value = '';
      applyFilters();
    }
    function changePage(dir) { currentPage += dir; loadLogs(); }

    async function loadLogs() {
      const status = document.getElementById('filter-status').value;
      const action = document.getElementById('filter-action').value;
      const from = document.getElementById('filter-date-from').value;
      const to = document.getElementById('filter-date-to').value;
      const sortVal = document.getElementById('filter-sort').value || 'timestamp_desc';
      const regNo = document.getElementById('filter-reg-no').value.trim();
      const sortParts = sortVal.split('_');
      const sortOrder = sortParts.pop();
      const sortBy = sortParts.join('_');

      const params = new URLSearchParams({ page: currentPage, per_page: 25 });
      if (status) params.set('status', status);
      if (action) params.set('action_type', action);
      if (from) params.set('date_from', from);
      if (to) params.set('date_to', to);
      if (regNo) params.set('reg_no', regNo);
      if (sortBy) params.set('sort_by', sortBy);
      if (sortOrder) params.set('sort_order', sortOrder);

      const data = await api(`/admin/attendance?${params}`);
      if (!data) return;
      lastData = data;

      document.getElementById('page-info').textContent = `Page ${data.page} of ${data.pages}`;
      document.getElementById('prev-btn').disabled = data.page <= 1;
      document.getElementById('next-btn').disabled = data.page >= data.pages;

      const tbody = document.getElementById('logs-tbody');
      const validLogs = data.logs.filter(log => !log.reason || !log.reason.includes('Demo Mode'));
      if (!validLogs.length) {
        tbody.innerHTML = '<tr><td colspan="8" class="td-loading">No records found (or all were Demo Mode)</td></tr>';
        return;
      }
      tbody.innerHTML = validLogs.map(log => {
        const isFlagged = log.attendance_mark === 'flagged';
        const rowStyle = isFlagged ? 'cursor: pointer; color: #facc15;' : 'cursor: pointer;';
        const nameDisplay = isFlagged ? `<span style="color:#facc15">${escHtml(log.teacher_name || 'â€”')}</span>` : escHtml(log.teacher_name || 'â€”');

        let statusBadge;
        if (isFlagged) {
          statusBadge = `<span class="badge badge--flagged">Flagged</span>`;
        } else if (log.status === 'success') {
          if (log.action_type === 'check_out') {
            const mark = (log.attendance_mark || '').toLowerCase();
            if (mark === 'half_day') {
              statusBadge = `<span class="badge" style="background:rgba(245,158,11,0.15);color:#f59e0b;border:1px solid rgba(245,158,11,0.3)">Half Day</span>`;
            } else {
              statusBadge = `<span class="badge badge--success">Full Day</span>`;
            }
          } else {
            statusBadge = `<span class="badge badge--success">Check-In âœ“</span>`;
          }
        } else {
          const mark = (log.attendance_mark || '').toLowerCase();
          if (mark === 'absent') {
            statusBadge = `<span class="badge badge--error">Absent</span>`;
          } else {
            statusBadge = `<span class="badge badge--error">Failed</span>`;
          }
        }

        return `
        <tr style="${rowStyle}" onclick="handleRowClick(event, '${log.id}', ${isFlagged})" class="log-row">
          <td><strong>${nameDisplay}</strong></td>
          <td style="${isFlagged ? '' : 'color:var(--text-muted);'}font-weight:500">${escHtml(log.reg_no || 'â€”')}</td>
          <td>${log.action_type ? `<span class="badge badge--${log.action_type}">${log.action_type === 'check_in' ? 'Check In' : log.action_type === 'check_out' ? 'Check Out' : log.action_type.replace(/_/g, ' ')}</span>` : 'â€”'}</td>
          <td>${formatDt(log.timestamp)}</td>
          <td>${statusBadge}</td>
          <td style="max-width:220px;white-space:normal">${escHtml(log.reason)}</td>
          <td style="font-size:12px">${log.latitude ? log.latitude.toFixed(4) + ', ' + log.longitude.toFixed(4) : 'â€”'}</td>
          <td style="text-align:center">${log.frames_count ?? 'â€”'}</td>
        </tr>
      `}).join('');
    }

    function handleRowClick(event, logId, isFlagged) {
      if (isFlagged) { event.stopPropagation(); openFlaggedModal(logId); }
      else { window.location.href = 'map.html?focus=' + logId; }
    }

    function openFlaggedModal(logId) {
      const existing = document.getElementById('flagged-modal');
      if (existing) existing.remove();
      const overlay = document.createElement('div');
      overlay.id = 'flagged-modal';
      overlay.className = 'modal-overlay';
      overlay.style.display = 'flex';
      overlay.innerHTML = `
        <div class="modal-card" style="max-width:380px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <h3 style="margin:0;font-size:16px;font-weight:700;">Resolve Flagged Attendance</h3>
            <button class="btn-icon" onclick="document.getElementById('flagged-modal').remove()">âœ•</button>
          </div>
          <p style="margin-bottom:20px;color:var(--text-muted);font-size:13px;">This teacher checked in late. Select their attendance mark for today:</p>
          <div style="display:flex;gap:10px;">
            <button onclick="resolveFlagged('${logId}','present')" style="flex:1;padding:12px;background:var(--success,#10b981);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:700;">Full Day</button>
            <button onclick="resolveFlagged('${logId}','half_day')" style="flex:1;padding:12px;background:#f59e0b;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:700;">Half Day</button>
            <button onclick="resolveFlagged('${logId}','absent')" style="flex:1;padding:12px;background:var(--error,#ef4444);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:700;">Absent</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
    }

    async function resolveFlagged(logId, mark) {
      const res = await fetch(`${API_BASE}/admin/attendance/${logId}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getToken()}` },
        body: JSON.stringify({ attendance_mark: mark })
      });
      if (res.ok) { document.getElementById('flagged-modal').remove(); loadLogs(); }
      else { await uiAlert('Failed to resolve log', { type: 'error' }); }
    }

    async function downloadCSV() {
      if (!lastData || !lastData.logs) return;
      let csvContent = "data:text/csv;charset=utf-8,";
      csvContent += "Teacher Name,Registration ID,Action,Timestamp,Status,Reason,Latitude,Longitude,Frames\n";
      lastData.logs.forEach(log => {
        const row = [
          `"${(log.teacher_name || '').replace(/"/g, '""')}"`,
          `"${log.reg_no || log.teacher_id}"`,
          `"${log.action_type || 'â€”'}"`,
          `"${log.timestamp}"`,
          `"${log.status}"`,
          `"${(log.reason || '').replace(/"/g, '""')}"`,
          log.latitude || '', log.longitude || '', log.frames_count || ''
        ];
        csvContent += row.join(",") + "\n";
      });
      const link = document.createElement("a");
      link.setAttribute("href", encodeURI(csvContent));
      link.setAttribute("download", `attendance_logs_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link); link.click(); document.body.removeChild(link);
    }

    initApp('logs');
    loadLogs();
  </script>
</body>
</html>
