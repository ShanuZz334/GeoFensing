name: geoface_auth
description: GeoFace Faculty Authentication System - Mobile App
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Networking
  http: ^1.2.1
  dio: ^5.4.3+1

  # Camera & video
  camera: ^0.12.0+1

  # Location
  geolocator: ^14.0.2

  # Permissions
  permission_handler: ^12.0.1

  # Secure token storage
  flutter_secure_storage: ^10.0.0

  # Image processing
  image: ^4.1.7

  # JSON serialization
  json_annotation: ^4.9.0

  # Typography
  google_fonts: ^8.0.2

  # UI helpers
  lottie: ^3.1.2
  flutter_animate: ^4.5.0
  percent_indicator: ^4.2.3

  # Utilities
  intl: ^0.20.2
  shared_preferences: ^2.2.3
  package_info_plus: ^9.0.1
  qr_flutter: ^4.1.0
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
  fonts:
    - family: Bitcount
      fonts:
        - asset: assets/fonts/Bitcount-ExtraLight.ttf
          weight: 200
