<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoFace Admin â€” Attendance Logs</title>
  <link rel="stylesheet" href="css/styles.css?v=11" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    @keyframes pulse {
      0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      }
      70% {
        transform: scale(1);
        box-shadow: 0 0 0 5px rgba(16, 185, 129, 0);
      }
      100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
      }
    }
    /* Premium Filter Bar Elements alignment & sizing */
    .filter-bar .filter-input,
    .filter-bar .uiverse-selected,
    .filter-bar .btn-secondary,
    .filter-date-range {
      height: 38px !important;
      box-sizing: border-box;
    }

    .filter-bar .uiverse-select {
      min-width: auto !important;
    }
    
    .filter-bar .uiverse-selected {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
    }

    /* Cohesive premium translucent design system for inputs */
    .filter-bar .filter-input,
    .filter-bar .uiverse-selected {
      border: 1px solid rgba(124, 58, 237, 0.25) !important;
      background: rgba(124, 58, 237, 0.04) !important;
      color: var(--text) !important;
      border-radius: var(--radius-sm) !important;
      transition: border-color var(--transition), box-shadow var(--transition), background var(--transition) !important;
    }
    
    .filter-bar .filter-input:hover,
    .filter-bar .uiverse-selected:hover {
      border-color: rgba(124, 58, 237, 0.55) !important;
      background: rgba(124, 58, 237, 0.06) !important;
    }
    
    .filter-bar .filter-input:focus,
    .filter-bar .uiverse-select.open > .uiverse-selected {
      border-color: var(--primary) !important;
      box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.15) !important;
      background: rgba(124, 58, 237, 0.08) !important;
      outline: none;
    }

    /* Chevron arrow micro-interaction */
    .filter-bar .uiverse-select:hover .uiverse-arrow {
      fill: var(--primary) !important;
    }

    /* Magnifying Glass Search SVG input wrapping */
    .search-wrapper {
      position: relative;
      display: inline-block;
      width: 180px;
    }
    .search-wrapper svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      color: var(--text-muted);
      pointer-events: none;
      transition: color var(--transition);
    }
    .search-wrapper:focus-within svg {
      color: var(--primary);
    }
    .search-wrapper .filter-input {
      width: 100%;
      padding-left: 34px !important;
    }
    
    /* Clean outline primary-tinted buttons with red-glow reset buttons */
    .filter-bar .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      font-weight: 600;
      font-size: 13px;
      height: 38px !important;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      cursor: pointer;
      transition: all var(--transition);
    }
    
    .filter-bar .btn-secondary:hover {
      background: rgba(239, 68, 68, 0.08);
      border-color: rgba(239, 68, 68, 0.4);
      color: #ef4444; /* Soft red on hover for clearing */
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.1);
    }

    /* Unified Premium Date Range Picker */
    .filter-date-range {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid rgba(124, 58, 237, 0.3);
      border-radius: var(--radius-sm);
      background: rgba(124, 58, 237, 0.04);
      padding: 0 14px;
      height: 38px !important;
      box-sizing: border-box;
      transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
    }
    .filter-date-range:hover {
      border-color: rgba(124, 58, 237, 0.6);
      background: rgba(124, 58, 237, 0.06);
    }
    .filter-date-range:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.15);
      background: rgba(124, 58, 237, 0.08);
    }
    .filter-date-range span {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #a78bfa; /* Light purple */
      font-weight: 600;
      user-select: none;
    }
    .filter-date-range input[type="date"] {
      border: none !important;
      background: transparent !important;
      color: var(--text) !important;
      font-size: 13px;
      outline: none;
      font-family: inherit;
      padding: 0;
      height: 100%;
      cursor: pointer;
      color-scheme: dark;
      width: 120px;
    }
    .filter-date-range input[type="date"]::-webkit-calendar-picker-indicator {
      filter: none !important;
      opacity: 0.8;
      cursor: pointer;
      margin-left: 4px;
    }

    /* Set proportional column widths to balance the table grid perfectly */
    .data-table th:nth-child(1), .data-table td:nth-child(1) { width: 18%; } /* Faculty */
    .data-table th:nth-child(2), .data-table td:nth-child(2) { width: 10%; } /* Reg No */
    .data-table th:nth-child(3), .data-table td:nth-child(3) { width: 12%; } /* Action */
    .data-table th:nth-child(4), .data-table td:nth-child(4) { width: 18%; } /* Timestamp */
    .data-table th:nth-child(5), .data-table td:nth-child(5) { width: 12%; } /* Status */
    .data-table th:nth-child(6), .data-table td:nth-child(6) { width: 20%; } /* Reason */
    .data-table th:nth-child(7), .data-table td:nth-child(7) { width: 15%; } /* Location */
    .data-table th:nth-child(8), .data-table td:nth-child(8) { width: 5%; text-align: center; } /* Frames */

    /* Premium Capsule Pill Badges */
    .data-table .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 100px; /* Pill style */
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    
    .data-table .badge--success {
      background: rgba(16, 185, 129, 0.08) !important;
      border: 1px solid rgba(16, 185, 129, 0.15) !important;
      color: #10b981 !important;
    }
    
    .data-table .badge--failure,
    .data-table .badge--error {
      background: rgba(239, 68, 68, 0.08) !important;
      border: 1px solid rgba(239, 68, 68, 0.15) !important;
      color: #ef4444 !important;
    }
    
    .data-table .badge--warning {
      background: rgba(245, 158, 11, 0.08) !important;
      border: 1px solid rgba(245, 158, 11, 0.15) !important;
      color: #f59e0b !important;
    }
    
    .data-table .badge--flagged {
      background: rgba(250, 204, 21, 0.08) !important;
      border: 1px solid rgba(250, 204, 21, 0.15) !important;
      color: #facc15 !important;
    }
    
    .data-table .badge--check_in {
      background: rgba(139, 92, 246, 0.08) !important;
      border: 1px solid rgba(139, 92, 246, 0.15) !important;
      color: #a78bfa !important;
    }
    
    .data-table .badge--check_out {
      background: rgba(168, 85, 247, 0.08) !important;
      border: 1px solid rgba(168, 85, 247, 0.15) !important;
      color: #c084fc !important;
    }
    
    .data-table .badge--absent {
      background: rgba(239, 68, 68, 0.08) !important;
      border: 1px solid rgba(239, 68, 68, 0.15) !important;
      color: #ef4444 !important;
    }

    /* Elegant Monospace Coordinate Badge */
    .coord-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(124, 58, 237, 0.04);
      border: 1px solid rgba(124, 58, 237, 0.12);
      padding: 4px 8px;
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12px;
      color: var(--text);
      font-weight: 500;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .coord-badge:hover {
      border-color: rgba(124, 58, 237, 0.3);
      background: rgba(124, 58, 237, 0.08);
    }

    /* Row Hover Transition */
    .data-table tr.log-row {
      transition: background-color 0.2s ease;
    }

    /* Muted reason text for success, crimson for failure */
    .data-table td.reason-cell {
      max-width: 260px;
      white-space: normal;
      font-size: 13px;
      line-height: 1.45;
    }
  </style>
</head>

  <main class="main-content">
    <header class="page-header" style="margin-bottom: 28px; display: flex; justify-content: space-between; align-items: center;">
      <div>
        <h1 class="page-title" style="font-size: 24px; font-weight: 700; background: linear-gradient(135deg, #c084fc 0%, #6366f1 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0;">Leave Applications History</h1>
        <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px; margin-bottom: 0;">Comprehensive history of approved and rejected leave requests.</p>
      </div>
      <div style="display: flex; align-items: center; gap: 12px;" class="filter-bar">
        <div class="search-wrapper">
          <svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          <input type="text" id="filter-reg-no" class="filter-input" placeholder="Search Reg No" onkeypress="if(event.key==='Enter') applyFilters()">
        </div>
        
        <div class="uiverse-select" tabindex="0" id="filter-status">
          <div class="uiverse-selected">
            <span class="uiverse-selected-text">Status: All</span>
            <svg class="uiverse-arrow" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"></path></svg>
          </div>
          <div class="uiverse-options">
            <div title="All Statuses"><input id="filter-status-all" value="" name="filter-status" type="radio" checked onchange="applyFilters()"><label class="uiverse-option" for="filter-status-all" data-txt="Status: All">Status: All</label></div>
            <div title="Approved"><input id="filter-status-app" value="approved" name="filter-status" type="radio" onchange="applyFilters()"><label class="uiverse-option" for="filter-status-app" data-txt="Approved">Approved</label></div>
            <div title="Rejected"><input id="filter-status-rej" value="rejected" name="filter-status" type="radio" onchange="applyFilters()"><label class="uiverse-option" for="filter-status-rej" data-txt="Rejected">Rejected</label></div>
            <div title="Pending"><input id="filter-status-pen" value="pending" name="filter-status" type="radio" onchange="applyFilters()"><label class="uiverse-option" for="filter-status-pen" data-txt="Pending">Pending</label></div>
          </div>
        </div>

        <div class="uiverse-select" tabindex="0" id="filter-type">
          <div class="uiverse-selected">
            <span class="uiverse-selected-text">Type: All</span>
            <svg class="uiverse-arrow" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"></path></svg>
          </div>
          <div class="uiverse-options">
            <div title="All Types"><input id="filter-type-all" value="" name="filter-type" type="radio" checked onchange="applyFilters()"><label class="uiverse-option" for="filter-type-all" data-txt="Type: All">Type: All</label></div>
            <div title="Normal"><input id="filter-type-nor" value="normal" name="filter-type" type="radio" onchange="applyFilters()"><label class="uiverse-option" for="filter-type-nor" data-txt="Normal">Normal</label></div>
            <div title="Emergency"><input id="filter-type-emg" value="emergency" name="filter-type" type="radio" onchange="applyFilters()"><label class="uiverse-option" for="filter-type-emg" data-txt="Emergency">Emergency</label></div>
          </div>
        </div>

        <button class="btn-secondary" onclick="resetFilters()">Clear</button>
      </div>
    </header>

    <div class="table-wrapper" style="overflow-x: auto;">
      <table class="data-table" id="leaves-table">
        <thead id="leaves-thead">
          <tr>
            <th style="width: 20%;">Faculty</th>
            <th style="width: 10%;">Reg No</th>
            <th style="width: 20%;">Leave Dates</th>
            <th style="width: 10%;">Type</th>
            <th style="width: 20%;">Reason</th>
            <th style="width: 10%;">Status</th>
            <th style="width: 10%;">Applied</th>
          </tr>
        </thead>
        <tbody id="leaves-tbody">
          <tr><td colspan="7" class="td-loading"><div class="gear-loader"></div></td></tr>
        </tbody>
      </table>
    </div>
  </main>


    <!-- Admin Login Modal -->
    <div class="modal-overlay" id="login-modal" style="display: none;">
    <div class="new-login-container">
      <div class="new-login-form">
        <div class="new-login-form_details">Login</div>
        <div id="login-error" class="error-banner" style="display:none; width: 100%; margin: 0;"></div>
        <input type="text" id="admin-reg-no" class="new-login-input" placeholder="Reg No" required>
        <input type="password" id="admin-password" class="new-login-input" placeholder="Password" required>
        <button id="btn-login" class="new-login-btn" onclick="adminLogin()">Login</button>
      </div>
    </div>
  </div>

  <script>
  function togglePasswordVisibility() {
    const pw = document.getElementById('admin-password');
    const icon = document.getElementById('eye-icon');
    if (pw.type === 'password') {
      pw.type = 'text';
      icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
    } else {
      pw.type = 'password';
      icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    }
  }
  </script>
