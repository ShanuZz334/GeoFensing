  <main class="main-content">
    <header class="page-header">
      <div>
        <h1 class="page-title">Manage Admins</h1>
        <p class="page-subtitle">Manage administrative access and system privileges</p>
      </div>
      <button class="btn-primary" onclick="showRegisterModal()">+ Register Admin</button>
    </header>

    <div class="table-wrapper">
      <table class="data-table">
        <thead>
          <tr>
            <th>Reg ID</th>
            <th>Name</th>
            <th>Role</th>
            <th>Registered</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="admins-tbody">
          <tr><td colspan="5" class="td-loading"><div class="gear-loader"></div></td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Register Admin Modal -->
  <div class="modal-overlay" id="register-modal" style="display:none;">
    <div class="modal-card" style="max-width:480px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
        <h2 class="modal-title" style="margin:0">Register New Admin</h2>
        <button class="btn-icon" onclick="hideRegisterModal()">✕</button>
      </div>
      <div id="register-error" class="error-banner" style="display:none;"></div>
      <div id="register-success" class="success-banner" style="display:none;"></div>

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="reg-name" placeholder="John Doe" />
      </div>
      <div class="form-group">
        <label>Registration Number (Reg ID)</label>
        <input type="text" id="reg-no" placeholder="ADMIN123" />
      </div>
      <div class="form-group">
        <label>Password (min 8 chars)</label>
        <input type="password" id="reg-password" placeholder="••••••••" />
      </div>
      <div class="form-group" style="display:flex; align-items:center; gap:12px; margin-top:20px; background:var(--surface-2); padding:15px; border-radius:8px;">
        <label class="uiverse-switch" style="flex-shrink:0;">
          <input type="checkbox" id="reg-is-head" onchange="toggleHeadAdminAuth()" />
          <span class="uiverse-slider"></span>
        </label>
        <span style="cursor:pointer;color:var(--text);font-weight:600" onclick="document.getElementById('reg-is-head').click()">Grant Head Admin Privileges</span>
      </div>
      <div class="form-group" id="head-admin-auth" style="display:none; margin-top:15px;">
        <label style="color:var(--purple)">Your Head Admin Password (Verification)</label>
        <input type="password" id="reg-head-password" placeholder="Enter your password to authorize" style="border-color:var(--purple)"/>
      </div>

      <div style="display:flex;gap:12px;margin-top:24px;">
        <button class="btn-secondary btn-full" onclick="hideRegisterModal()">Cancel</button>
        <button class="btn-primary btn-full" id="btn-register-submit" onclick="submitRegister()">Register Admin</button>
      </div>
    </div>
  </div>

  <script src="js/api.js?v=2"></script>
  <script src="js/app.js?v=2"></script>
  <script>
    let currentAdminRegNo = null;

    async function loadAdmins() {
      const data = await api('/admin/admins');
      if (!data) return;
      
      const adminData = getAdminData();
      currentAdminRegNo = adminData ? adminData.reg_no : null;

      const tbody = document.getElementById('admins-tbody');
      tbody.innerHTML = data.map(a => {
        const isMe = a.reg_no === currentAdminRegNo;
        return `
        <tr>
          <td><code style="font-size:12px; ${isMe ? 'color:var(--purple); font-weight:700;' : ''}">${escHtml(a.reg_no)}</code></td>
          <td><strong>${escHtml(a.name)}</strong></td>
          <td><span style="color:var(--text); font-weight:500;">${a.is_head_admin ? 'Head Admin' : 'Admin'}</span></td>
          <td style="font-size:12px;color:var(--text-muted)">${formatDt(a.created_at)}</td>
          <td>
            <button class="btn-icon" title="Delete Admin" onclick="deleteAdmin('${a.id}', '${escHtml(a.name)}')" style="color:#ef4444" ${isMe ? 'disabled opacity="0.5"' : ''}>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path><line x1="10" x2="10" y1="11" y2="17"></line><line x1="14" x2="14" y1="11" y2="17"></line></svg>
            </button>
          </td>
        </tr>
      `}).join('');
    }

    function toggleHeadAdminAuth() {
      const isHead = document.getElementById('reg-is-head').checked;
      document.getElementById('head-admin-auth').style.display = isHead ? 'block' : 'none';
      if (!isHead) document.getElementById('reg-head-password').value = '';
    }

    function showRegisterModal() {
      document.getElementById('reg-name').value = '';
      document.getElementById('reg-no').value = '';
      document.getElementById('reg-password').value = '';
      document.getElementById('reg-is-head').checked = false;
      document.getElementById('reg-head-password').value = '';
      toggleHeadAdminAuth();
      
      document.getElementById('register-error').style.display = 'none';
      document.getElementById('register-success').style.display = 'none';
      document.getElementById('register-modal').style.display = 'flex';
    }

    function hideRegisterModal() {
      document.getElementById('register-modal').style.display = 'none';
    }

    async function submitRegister() {
      const name = document.getElementById('reg-name').value.trim();
      const regNo = document.getElementById('reg-no').value.trim();
      const password = document.getElementById('reg-password').value;
      const isHeadAdmin = document.getElementById('reg-is-head').checked;
      const headAdminPassword = document.getElementById('reg-head-password').value;

      const errEl = document.getElementById('register-error');
      const okEl = document.getElementById('register-success');
      errEl.style.display = 'none'; okEl.style.display = 'none';

      if (!name || !regNo || !password) {
        errEl.textContent = 'Name, Reg ID, and Password are required.';
        errEl.style.display = 'block'; return;
      }

      if (isHeadAdmin && !headAdminPassword) {
        errEl.textContent = 'Your Head Admin Password is required to grant head admin privileges.';
        errEl.style.display = 'block'; return;
      }

      const payload = { 
        name, 
        reg_no: regNo, 
        password,
        is_head_admin: isHeadAdmin,
        head_admin_password: headAdminPassword
      };

      const btn = document.getElementById('btn-register-submit');
      btn.disabled = true;
      btn.textContent = 'Registering...';

      const data = await api('/admin/admins', 'POST', payload);
      
      btn.disabled = false;
      btn.textContent = 'Register Admin';

      if (data) {
        okEl.textContent = `Administrator "${name}" registered successfully!`;
        okEl.style.display = 'block';
        setTimeout(() => { hideRegisterModal(); loadAdmins(); }, 1500);
      }
    }

    async function deleteAdmin(id, name) {
      if (!isCurrentAdminHeadAdmin()) {
        uiAlert("Permission Denied", "Only Head Admins can delete administrators.");
        return;
      }

      const modalHtml = `
        <div id="delete-admin-modal" class="modal-overlay" style="display:flex; z-index: 99999;">
          <div class="modal-card" style="max-width: 400px;">
            <h3 style="margin-bottom: 10px; color: var(--error);">Delete Administrator</h3>
            <p style="margin-bottom: 24px; color: var(--text-muted); line-height: 1.5;">Are you sure you want to permanently delete <strong>${escHtml(name)}</strong>? Enter your Head Admin password to confirm.</p>
            <div class="form-group" style="margin-bottom: 24px;">
              <input type="password" id="delete-admin-password" placeholder="Your Password" style="border-color:var(--error)"/>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 12px;">
              <button id="del-cancel-btn" class="btn-secondary">Cancel</button>
              <button id="del-confirm-btn" class="btn-primary" style="background:var(--error);border-color:var(--error)">Delete Admin</button>
            </div>
          </div>
        </div>
      `;
      document.body.insertAdjacentHTML('beforeend', modalHtml);

      document.getElementById('del-cancel-btn').onclick = () => {
        document.getElementById('delete-admin-modal').remove();
      };

      document.getElementById('del-confirm-btn').onclick = async () => {
        const pwd = document.getElementById('delete-admin-password').value;
        if (!pwd) {
          showToast("Password is required", "error");
          return;
        }

        const btn = document.getElementById('del-confirm-btn');
        btn.disabled = true;
        btn.textContent = 'Deleting...';

        const data = await api(`/admin/admins/${id}`, 'DELETE', { password: pwd });
        if (data) {
          document.getElementById('delete-admin-modal').remove();
          showToast("Administrator removed successfully");
          loadAdmins();
        } else {
          btn.disabled = false;
          btn.textContent = 'Delete Admin';
        }
      };
    }

    initApp('admins', loadAdmins);
  </script>
