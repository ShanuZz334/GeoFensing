<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoFace Admin — Alert Center</title>
  <link rel="stylesheet" href="css/styles.css?v=9" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    @keyframes pulse {
      0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      }
      70% {
        transform: scale(1);
        box-shadow: 0 0 0 5px rgba(16, 185, 129, 0);
      }
      100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
      }
    }

    /* Proportional columns for Alerts Center */
    .data-table th:nth-child(1), .data-table td:nth-child(1) { width: 16%; } /* Timestamp */
    .data-table th:nth-child(2), .data-table td:nth-child(2) { width: 22%; } /* Type */
    .data-table th:nth-child(3), .data-table td:nth-child(3) { width: 18%; } /* Teacher */
    .data-table th:nth-child(4), .data-table td:nth-child(4) { width: 26%; } /* Description */
    .data-table th:nth-child(5), .data-table td:nth-child(5) { width: 18%; } /* Action */

    .alert-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-right: 10px;
      flex-shrink: 0;
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }

    .alert-icon.error {
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.05);
    }

    .alert-icon.warning {
      background: rgba(245, 158, 11, 0.1);
      border-color: rgba(245, 158, 11, 0.15);
      color: #f59e0b;
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.05);
    }

    .alert-icon.info {
      background: rgba(59, 130, 246, 0.1);
      border-color: rgba(59, 130, 246, 0.15);
      color: #3b82f6;
      box-shadow: 0 0 8px rgba(59, 130, 246, 0.05);
    }

    .alert-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-resolve {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 32px;
      padding: 0 14px;
      font-size: 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
      letter-spacing: 0.2px;
    }

    .btn-resolve.primary {
      background: rgba(168, 85, 247, 0.1);
      border: 1px solid rgba(168, 85, 247, 0.25);
      color: #c084fc;
    }

    .btn-resolve.primary:hover {
      background: rgba(168, 85, 247, 0.18);
      border-color: rgba(168, 85, 247, 0.45);
      color: #d8b4fe;
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.15);
    }

    .btn-resolve.danger {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #f87171;
    }

    .btn-resolve.danger:hover {
      background: rgba(239, 68, 68, 0.18);
      border-color: rgba(239, 68, 68, 0.45);
      color: #fca5a5;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.15);
    }

    .btn-resolve.warning {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.25);
      color: #fbbf24;
    }

    .btn-resolve.warning:hover {
      background: rgba(245, 158, 11, 0.18);
      border-color: rgba(245, 158, 11, 0.45);
      color: #fcd34d;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.15);
    }

    .btn-resolve.secondary {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
    }

    .btn-resolve.secondary:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.18);
      color: var(--text);
    }

    /* Monospace Reg ID style */
    .reg-id-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      padding: 2px 5px;
      border-radius: 4px;
      white-space: nowrap;
    }

    /* Tabular Timestamp style */
    .timestamp-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Row Hover Interaction */
    .data-table tr {
      transition: background-color 0.2s ease;
    }
  </style>
</head>

  <script>
    const alertIcons = {
      flagged_log: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><line x1="4" x2="4" y1="22" y2="15"></line></svg>',
      failed_log: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>',
      abandoned_checkin: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>',
      unusual_activity: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>',
      spoof_detected: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><line x1="9" y1="9" x2="15" y2="15"></line><line x1="15" y1="9" x2="9" y2="15"></line></svg>'
    };

    const alertStyles = {
      flagged_log: 'warning',
      failed_log: 'error',
      abandoned_checkin: 'info',
      unusual_activity: 'error',
      spoof_detected: 'error'
    };

    async function loadAlerts() {
      const data = await api('/admin/alerts');
      if (!data) return;

      const tbody = document.getElementById('alerts-tbody');
      const alerts = data.alerts || [];

      // Update badge
      const badge = document.getElementById('sidebar-alert-badge');
      if (badge) {
        badge.textContent = alerts.length;
        badge.style.display = alerts.length > 0 ? 'flex' : 'none';
      }

      if (alerts.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="td-loading">No active alerts requiring your attention.</td></tr>';
        return;
      }

      tbody.innerHTML = alerts.map(a => {
        let actions = '';
        if (a.type === 'flagged_log') {
          actions = `
            <button class="btn-resolve primary" onclick="resolveAlert('${a.type}', 'present', '${a.log_id}', null, event)">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="pointer-events: none;"><polyline points="20 6 9 17 4 12"></polyline></svg>
              Full Day
            </button>
            <button class="btn-resolve warning" onclick="resolveAlert('${a.type}', 'half_day', '${a.log_id}', null, event)">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="pointer-events: none;"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 12"></polyline></svg>
              Half Day
            </button>
            <button class="btn-resolve danger" onclick="resolveAlert('${a.type}', 'absent', '${a.log_id}', null, event)">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="pointer-events: none;"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
              Absent
            </button>
          `;
        } else if (a.type === 'abandoned_checkin') {
          actions = `
            <button class="btn-resolve primary" onclick="resolveAlert('${a.type}', 'force_checkout', '${a.log_id}', null, event)">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="pointer-events: none;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
              Force Checkout
            </button>
            <button class="btn-resolve warning" onclick="resolveAlert('${a.type}', 'mark_half_day', '${a.log_id}', null, event)">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="pointer-events: none;"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 12"></polyline></svg>
              Half Day
            </button>
            <button class="btn-resolve danger" onclick="resolveAlert('${a.type}', 'mark_absent', '${a.log_id}', null, event)">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="pointer-events: none;"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
              Absent
            </button>
          `;
        } else if (a.type === 'unusual_activity') {
          actions = `
            <button class="btn-resolve secondary" onclick="resolveAlert('${a.type}', 'dismiss', null, '${a.teacher_id}', event)">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="pointer-events: none;"><polyline points="20 6 9 17 4 12"></polyline><polyline points="22 10 17 15 14 12"></polyline></svg>
              Dismiss
            </button>
          `;
        } else if (a.type === 'spoof_detected') {
          actions = `
            <button class="btn-resolve secondary" onclick="resolveAlert('${a.type}', 'dismiss', '${a.log_id}', null, event)">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="pointer-events: none;"><polyline points="20 6 9 17 4 12"></polyline><polyline points="22 10 17 15 14 12"></polyline></svg>
              Dismiss
            </button>
            <button class="btn-resolve secondary" onclick="window.location.href='logs.html?reg_no=${encodeURIComponent(a.teacher_id)}'">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="pointer-events: none;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
              View Logs
            </button>
          `;
        } else if (a.type === 'failed_log') {
          actions = `
            <button class="btn-resolve secondary" onclick="window.location.href='logs.html?reg_no=${encodeURIComponent(a.teacher_id)}'">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="pointer-events: none;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
              View Logs
            </button>
          `;
        }

        const iconStyle = alertStyles[a.type] || 'info';

        // 1. Timestamp formatting (Date vs Time split)
        const dateStr = formatDt(a.timestamp);
        const parts = dateStr.split(', ');
        const datePart = parts[0] || dateStr;
        const timePart = parts[1] || '';

        // 2. Alert Type pill badge
        let badgeHtml = '';
        if (a.type === 'flagged_log') {
          badgeHtml = '<span class="badge badge--warning" style="font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 12px; letter-spacing: 0.5px; border: 1px solid rgba(245, 158, 11, 0.25);">FLAGGED SCAN</span>';
        } else if (a.type === 'failed_log') {
          badgeHtml = '<span class="badge badge--error" style="font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 12px; letter-spacing: 0.5px; border: 1px solid rgba(239, 68, 68, 0.25);">FAILED SCAN</span>';
        } else if (a.type === 'spoof_detected') {
          badgeHtml = '<span class="badge badge--error" style="font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 12px; letter-spacing: 0.5px; border: 1px solid rgba(239, 68, 68, 0.25);">SPOOF DETECTED</span>';
        } else if (a.type === 'unusual_activity') {
          badgeHtml = '<span class="badge badge--error" style="font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 12px; letter-spacing: 0.5px; border: 1px solid rgba(239, 68, 68, 0.25);">UNUSUAL ACTIVITY</span>';
        } else if (a.type === 'abandoned_checkin') {
          badgeHtml = '<span class="badge badge--neutral" style="font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 12px; letter-spacing: 0.5px; border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(255,255,255,0.04);">ABANDONED</span>';
        } else {
          badgeHtml = `<span class="badge badge--neutral" style="font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 12px; letter-spacing: 0.5px;">${escHtml(a.type.replace('_', ' ').toUpperCase())}</span>`;
        }

        // 3. Fallback initials avatar
        const name = a.teacher_name || 'Teacher';
        const initial = name.charAt(0).toUpperCase();
        const avatarHtml = a.profile_pic 
          ? `<img src="${a.profile_pic.startsWith('data:') ? a.profile_pic : 'data:image/jpeg;base64,' + a.profile_pic}" alt="${escHtml(name)}" style="width:36px; height:36px; border-radius:50%; object-fit:cover; background:var(--surface-2); border:1.5px solid rgba(192, 132, 252, 0.35);" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />` 
          : '';
        const fallbackAvatarHtml = `<div class="avatar-fallback" style="display: ${a.profile_pic ? 'none' : 'flex'}; width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg, #c084fc 0%, #6366f1 100%); color:#fff; align-items:center; justify-content:center; font-weight:700; font-size:14px; border:1.5px solid rgba(192, 132, 252, 0.35); text-shadow: 0 1px 2px rgba(0,0,0,0.15);">${initial}</div>`;

        // 4. Bordered Description Callout
        let borderLeftColor = '#3b82f6';
        let calloutBg = 'rgba(59, 130, 246, 0.03)';
        let calloutBorder = 'rgba(59, 130, 246, 0.1)';
        let descIcon = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0; margin-top:2px; color:#3b82f6;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>';

        if (iconStyle === 'error') {
          borderLeftColor = '#ef4444';
          calloutBg = 'rgba(239, 68, 68, 0.03)';
          calloutBorder = 'rgba(239, 68, 68, 0.1)';
          descIcon = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0; margin-top:2px; color:#ef4444;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>';
        } else if (iconStyle === 'warning') {
          borderLeftColor = '#f59e0b';
          calloutBg = 'rgba(245, 158, 11, 0.03)';
          calloutBorder = 'rgba(245, 158, 11, 0.1)';
          descIcon = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0; margin-top:2px; color:#f59e0b;"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><line x1="4" x2="4" y1="22" y2="15"></line></svg>';
        }

        return `
        <tr>
          <td>
            <div style="display: flex; flex-direction: column; gap: 4px;">
              <span style="font-weight: 600; color: var(--text); font-size: 13px;">${escHtml(datePart)}</span>
              ${timePart ? `
                <span style="display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-muted); font-family: monospace;">
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="opacity: 0.6;"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                  ${escHtml(timePart)}
                </span>
              ` : ''}
            </div>
          </td>
          <td>
            <div style="display:flex; flex-direction:column; gap:6px; align-items:flex-start;">
              ${badgeHtml}
              <div style="display:flex; align-items:center; gap:8px;">
                <div class="alert-icon ${iconStyle}" style="margin: 0; width: 22px; height: 22px; border-radius: 6px;">
                  ${alertIcons[a.type] || alertIcons.info}
                </div>
                <span style="font-weight:600; color:var(--text); font-size:13px;">${escHtml(a.title)}</span>
              </div>
            </div>
          </td>
          <td>
            <div style="display:flex; align-items:center; gap:12px;">
              <div style="position:relative; width:36px; height:36px; flex-shrink:0;">
                ${avatarHtml}
                ${fallbackAvatarHtml}
              </div>
              <div style="display:flex; flex-direction:column; gap:3px;">
                <span style="font-weight:600; color:var(--text); font-size:13px;">${escHtml(name)}</span>
                <code class="reg-id-code" style="font-size:10px; width:fit-content; background:rgba(255,255,255,0.03); border-color:rgba(255,255,255,0.06); padding: 1px 5px; border-radius:4px;">${escHtml(a.teacher_id)}</code>
              </div>
            </div>
          </td>
          <td>
            <div style="background: ${calloutBg}; border-left: 3px solid ${borderLeftColor}; border-top: 1px solid ${calloutBorder}; border-right: 1px solid ${calloutBorder}; border-bottom: 1px solid ${calloutBorder}; padding: 10px 14px; border-radius: 6px; font-size: 13px; line-height: 1.5; color: var(--text-muted); display: flex; gap: 8px; align-items: flex-start;">
              ${descIcon}
              <span style="flex:1;">${escHtml(a.description)}</span>
            </div>
          </td>
          <td>
            <div class="alert-actions">
              ${actions}
            </div>
          </td>
        </tr>
      `}).join('');
    }

    async function resolveAlert(type, action, logId, teacherId, event) {
      if (event && event.target) {
        event.target.textContent = '...';
        event.target.disabled = true;
      }

      const payload = { type, action };
      if (logId) payload.log_id = logId;
      if (teacherId) payload.teacher_id = teacherId;

      const data = await api('/admin/alerts/resolve', 'POST', payload);
      if (data) {
        showToast(data.message || "Alert resolved");
        loadAlerts();
      } else {
        if (event && event.target) {
          event.target.disabled = false;
          event.target.textContent = 'Retry';
        }
      }
    }

    initApp('alerts', loadAlerts);
  </script>
</body>

</html>
