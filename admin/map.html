  <style>
    @keyframes pulse {
      0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      }
      70% {
        transform: scale(1);
        box-shadow: 0 0 0 5px rgba(16, 185, 129, 0);
      }
      100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
      }
    }

    #map {
      height: calc(100vh - 160px);
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      z-index: 1;
    }

    /* Dark mode for Leaflet Layer Control */
    .leaflet-control-layers {
      background: rgba(26, 26, 46, 0.85) !important;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      border-radius: 12px !important;
      color: var(--text-muted) !important;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5) !important;
    }
    .leaflet-control-layers-expanded {
      padding: 12px 16px !important;
    }
    .leaflet-control-layers label {
      color: var(--text) !important;
      font-size: 13px;
      margin-bottom: 4px;
    }
    .leaflet-control-layers-separator {
      border-top: 1px solid rgba(255,255,255,0.1) !important;
    }
  </style>
</head>

  <!-- -- Main Content ------------------------------------------------- -->
  <main class="main-content">
    <header class="page-header" style="margin-bottom: 28px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
      <div>
        <h1 class="page-title" style="font-size: 24px; font-weight: 700; background: linear-gradient(135deg, #c084fc 0%, #6366f1 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0;">Geofence Control Map</h1>
        <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px; margin-bottom: 0;">Define and modify institutional boundaries, scan radii, and active coordinate corridors.</p>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
        <div class="header-actions" style="margin: 0; display: flex; gap: 8px;">
          <button class="btn-primary" id="btn-edit-geofence" onclick="toggleEditMode()" style="margin: 0;">
            Edit Geofence
          </button>
          
          <!-- Editor Mode Selection (Visible only in Edit Mode) -->
          <div id="editor-tools" style="display:none; gap: 6px; border: 1px solid rgba(124, 58, 237, 0.4); background: rgba(124, 58, 237, 0.05); padding: 4px; border-radius: 8px;">
            <button class="btn-secondary" id="tool-main" onclick="setEditorTool('main')" style="margin:0; white-space: nowrap;">Main Polygon</button>
            <button class="btn-secondary" id="tool-sub" onclick="setEditorTool('sub')" style="margin:0; white-space: nowrap;">Dept Block</button>
            <button class="btn-secondary" id="tool-cp" onclick="setEditorTool('cp')" style="margin:0; white-space: nowrap;">Checkpoint</button>
          </div>
          <button class="btn-secondary" id="btn-clear-geofence" onclick="clearGeofence()" style="display:none; color: #ef4444; border-color: #ef4444; margin: 0;">
            Clear All Points
          </button>
          <button class="btn-secondary" id="btn-cancel-edit" onclick="cancelEditMode()" style="display:none; margin: 0;">
            Cancel
          </button>
          <button class="btn-primary" id="btn-save-geofence" onclick="saveGeofence()" style="display:none; margin: 0;">
            Save Polygon
          </button>
        </div>
      </div>
    </header>

    <!-- Edit instructions removed as per request -->

    <div style="position: relative;">
      
      <!-- Sub-Polygon Modal Overlay -->
      <div id="sub-polygon-modal" style="display:none; position:absolute; inset:0; z-index:2000; background:rgba(0,0,0,0.5); backdrop-filter:blur(4px); align-items:center; justify-content:center;">
        <div style="background:var(--surface); padding:24px; border-radius:12px; width:340px; border:1px solid var(--border); box-shadow:0 10px 40px rgba(0,0,0,0.5);">
          <h3 style="margin-top:0; margin-bottom:16px;">Save Sub-Polygon</h3>
          <div class="form-group" style="margin-bottom:16px;">
            <label>Department</label>
            <div class="uiverse-select form-control" id="sub-dept-select"
              style="padding:0; border:none; background:transparent; width:100%">
              <div class="uiverse-selected" style="height:42px;">
                <span class="uiverse-selected-text">Select School / Department</span>
                <svg xmlns="http://www.w3.org/2000/svg" height="1em" viewBox="0 0 512 512" class="uiverse-arrow">
                  <path d="M233.4 406.6c12.5 12.5 32.8 12.5 45.3 0l192-192c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L256 338.7 86.6 169.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3l192 192z"></path>
                </svg>
              </div>
              <div class="uiverse-options">
                <div class="multi-select-item" title="Select School / Department"><input id="sd-none" value="" name="sub-dept-checkbox" type="checkbox" style="display:none;"><label for="sd-none">Select School / Department</label></div>
                <div class="multi-select-item" title="School of Computer Science &amp; Engineering (CSE)"><input id="sd-cse" value="School of Computer Science &amp; Engineering (CSE)" data-txt="CSE" name="sub-dept-checkbox" type="checkbox"><label for="sd-cse">CSE</label></div>
                <div class="multi-select-item" title="School of Engineering"><input id="sd-eng" value="School of Engineering" data-txt="Engineering" name="sub-dept-checkbox" type="checkbox"><label for="sd-eng">Engineering</label></div>
                <div class="multi-select-item" title="Mittal School of Business / Management &amp; Commerce"><input id="sd-biz" value="Mittal School of Business / Management &amp; Commerce" data-txt="Business" name="sub-dept-checkbox" type="checkbox"><label for="sd-biz">Business</label></div>
                <div class="multi-select-item" title="School of Agriculture"><input id="sd-agr" value="School of Agriculture" data-txt="Agriculture" name="sub-dept-checkbox" type="checkbox"><label for="sd-agr">Agriculture</label></div>
                <div class="multi-select-item" title="School of Pharmacy / Pharmaceutical Sciences"><input id="sd-phm" value="School of Pharmacy / Pharmaceutical Sciences" data-txt="Pharmacy" name="sub-dept-checkbox" type="checkbox"><label for="sd-phm">Pharmacy</label></div>
                <div class="multi-select-item" title="School of Law"><input id="sd-law" value="School of Law" data-txt="Law" name="sub-dept-checkbox" type="checkbox"><label for="sd-law">Law</label></div>
                <div class="multi-select-item" title="School of Architecture &amp; Design"><input id="sd-arc" value="School of Architecture &amp; Design" data-txt="Architecture" name="sub-dept-checkbox" type="checkbox"><label for="sd-arc">Architecture</label></div>
                <div class="multi-select-item" title="School of Hotel Management &amp; Tourism"><input id="sd-hot" value="School of Hotel Management &amp; Tourism" data-txt="Hotel Management" name="sub-dept-checkbox" type="checkbox"><label for="sd-hot">Hotel Management</label></div>
                <div class="multi-select-item" title="School of Humanities &amp; Social Sciences"><input id="sd-hum" value="School of Humanities &amp; Social Sciences" data-txt="Humanities" name="sub-dept-checkbox" type="checkbox"><label for="sd-hum">Humanities</label></div>
                <div class="multi-select-item" title="School of Sciences"><input id="sd-sci" value="School of Sciences" data-txt="Sciences" name="sub-dept-checkbox" type="checkbox"><label for="sd-sci">Sciences</label></div>
                <div class="multi-select-item" title="School of Media, Animation &amp; Multimedia"><input id="sd-med" value="School of Media, Animation &amp; Multimedia" data-txt="Media" name="sub-dept-checkbox" type="checkbox"><label for="sd-med">Media</label></div>
                <div class="multi-select-item" title="School of Education &amp; Physical Education"><input id="sd-edu" value="School of Education &amp; Physical Education" data-txt="Education" name="sub-dept-checkbox" type="checkbox"><label for="sd-edu">Education</label></div>
                <div class="multi-select-item" title="School of Allied Medical Sciences / Physiotherapy"><input id="sd-meds" value="School of Allied Medical Sciences / Physiotherapy" data-txt="Medical Sciences" name="sub-dept-checkbox" type="checkbox"><label for="sd-meds">Medical Sciences</label></div>
                <div class="multi-select-item" title="School of Computer Applications &amp; IT"><input id="sd-it" value="School of Computer Applications &amp; IT" data-txt="IT" name="sub-dept-checkbox" type="checkbox"><label for="sd-it">IT</label></div>
              </div>
            </div>
          </div>
          <div class="form-group">
            <label>Color</label>
            <input type="hidden" id="sub-color" value="#ff4d4d" />
            <div class="color-swatch-container">
              <div class="color-swatch selected" style="background-color: #ff4d4d;" data-color="#ff4d4d" onclick="selectColor(this)"></div>
              <div class="color-swatch" style="background-color: #ff9f43;" data-color="#ff9f43" onclick="selectColor(this)"></div>
              <div class="color-swatch" style="background-color: #feca57;" data-color="#feca57" onclick="selectColor(this)"></div>
              <div class="color-swatch" style="background-color: #1dd1a1;" data-color="#1dd1a1" onclick="selectColor(this)"></div>
              <div class="color-swatch" style="background-color: #54a0ff;" data-color="#54a0ff" onclick="selectColor(this)"></div>
              <div class="color-swatch" style="background-color: #5f27cd;" data-color="#5f27cd" onclick="selectColor(this)"></div>
              <div class="color-swatch" style="background-color: #ff9ff3;" data-color="#ff9ff3" onclick="selectColor(this)"></div>
              <div class="color-swatch" style="background-color: #c8d6e5;" data-color="#c8d6e5" onclick="selectColor(this)"></div>
            </div>
          </div>
          <div style="display:flex; gap:12px; margin-top:20px;">
            <button class="btn-primary" onclick="commitSubPolygon()" style="flex:1">Save</button>
            <button class="btn-secondary" onclick="cancelSubPolygon()">Cancel</button>
          </div>
        </div>
      </div>
      
      <!-- Checkpoint Modal Overlay -->
      <div id="checkpoint-modal" style="display:none; position:absolute; inset:0; z-index:2000; background:rgba(0,0,0,0.5); backdrop-filter:blur(4px); align-items:center; justify-content:center;">
        <div style="background:var(--surface); padding:24px; border-radius:12px; width:340px; border:1px solid var(--border); box-shadow:0 10px 40px rgba(0,0,0,0.5);">
          <h3 style="margin-top:0; margin-bottom:16px;">Save Checkpoint</h3>
          <div class="form-group">
            <label>Radius (meters)</label>
            <input type="number" id="cp-radius" class="form-control" value="50" min="5" max="500" />
          </div>
          <div style="display:flex; gap:12px; margin-top:20px;">
            <button class="btn-primary" onclick="commitCheckpoint()" style="flex:1">Save</button>
            <button class="btn-secondary" onclick="cancelCheckpoint()">Cancel</button>
          </div>
        </div>
      </div>
      <!-- Toggle button for manual panel (visible when panel is hidden in edit mode) -->
      <button id="btn-show-manual" onclick="toggleManualPanel(true)" style="display:none; position: absolute; top: 16px; right: 16px; z-index: 1000; background:rgba(26, 26, 46, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:10px 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); color: var(--text); font-size:13px; font-weight:600; cursor:pointer; align-items:center; gap:8px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="color:var(--primary);"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
        Add Point Manually
      </button>

      <!-- Manual coordinate input (visible in edit mode only) -->
      <div id="manual-coord-panel" style="display:none; position: absolute; top: 16px; right: 16px; z-index: 1000; background:rgba(26, 26, 46, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:16px 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); width: 340px;">
        <div style="font-size:13px; font-weight:600; color:var(--text-muted); margin-bottom:12px; display:flex; align-items:center; justify-content:space-between;">
          <div style="display:flex; align-items:center; gap:6px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="color:var(--primary);"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
            Add Point Manually
          </div>
          <button onclick="toggleManualPanel(false)" style="background:transparent; border:none; color:var(--text-muted); cursor:pointer; padding:4px; display:flex; align-items:center; justify-content:center; border-radius:4px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:flex-end;">
          <div class="form-group" style="margin-bottom:0">
            <label style="font-size: 11px; margin-bottom: 4px;">Latitude</label>
            <input type="number" id="manual-lat" class="form-control" step="0.000001" placeholder="31.2536" style="height: 38px; font-size: 13px;" />
          </div>
          <div class="form-group" style="margin-bottom:0">
            <label style="font-size: 11px; margin-bottom: 4px;">Longitude</label>
            <input type="number" id="manual-lng" class="form-control" step="0.000001" placeholder="75.7037" style="height: 38px; font-size: 13px;" />
          </div>
          <div style="grid-column: span 2;">
            <button class="btn-primary" onclick="addManualPoint()" style="width: 100%; height:38px; font-size: 13px; margin: 0; justify-content: center;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="margin-right: 6px;"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              Add Coordinate
            </button>
          </div>
        </div>
      </div>

      <div id="map"></div>
    </div>
  </main>

  <script src="js/api.js?v=1028"></script>
  <script src="js/app.js?v=1028"></script>
  <script src="js/map.js?v=1030"></script>
</body>
</html>
