  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    .alert-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      vertical-align: middle;
      margin-right: 8px;
    }
    .alert-icon.error { background: rgba(239, 68, 68, 0.1); color: #ef4444; }
    .alert-icon.warning { background: rgba(245, 158, 11, 0.1); color: #f59e0b; }
    .alert-icon.info { background: rgba(59, 130, 246, 0.1); color: #3b82f6; }
    .alert-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-resolve { padding: 4px 10px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; font-weight: 500; transition: 0.2s; }
    .btn-resolve.primary { background: var(--primary); color: white; }
    .btn-resolve.primary:hover { background: var(--primary-hover); }
    .btn-resolve.danger { background: var(--error); color: white; }
    .btn-resolve.danger:hover { opacity: 0.9; }
    .btn-resolve.warning { background: #f59e0b; color: white; }
    .btn-resolve.warning:hover { opacity: 0.9; }
    .btn-resolve.secondary { background: var(--surface-3); color: var(--text); }
    .btn-resolve.secondary:hover { background: var(--border); }
  </style>
</head>

  <main class="main-content">
    <header class="page-header">
      <div>
        <h1 class="page-title">Alert Center</h1>
        <p class="page-subtitle">Actionable alerts and system notifications requiring attention</p>
      </div>
      <button class="btn-secondary" onclick="loadAlerts()">↻ Refresh</button>
    </header>

    <div class="table-wrapper">
      <table class="data-table">
        <thead>
          <tr>
            <th style="width: 15%">Timestamp</th>
            <th style="width: 15%">Type</th>
            <th style="width: 20%">Teacher</th>
            <th style="width: 30%">Description</th>
            <th style="width: 20%">Action</th>
          </tr>
        </thead>
        <tbody id="alerts-tbody">
          <tr><td colspan="5" class="td-loading">Loading alerts...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="js/api.js?v=2"></script>
  <script src="js/app.js?v=2"></script>
  <script>
    const alertIcons = {
      flagged_log: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><line x1="4" x2="4" y1="22" y2="15"></line></svg>',
      abandoned_checkin: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>',
      unusual_activity: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>'
    };

    const alertStyles = {
      flagged_log: 'warning',
      abandoned_checkin: 'info',
      unusual_activity: 'error'
    };

    async function loadAlerts() {
      const data = await api('/admin/alerts');
      if (!data) return;

      const tbody = document.getElementById('alerts-tbody');
      const alerts = data.alerts || [];

      // Update badge
      const badge = document.getElementById('sidebar-alert-badge');
      if (badge) {
        badge.textContent = alerts.length;
        badge.style.display = alerts.length > 0 ? 'flex' : 'none';
      }

      if (alerts.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="td-loading">No active alerts requiring your attention.</td></tr>';
        return;
      }

      tbody.innerHTML = alerts.map(a => {
        let actions = '';
        if (a.type === 'flagged_log') {
          actions = `
            <button class="btn-resolve primary" onclick="resolveAlert('${a.type}', 'present', '${a.log_id}', null, event)">Full Day</button>
            <button class="btn-resolve warning" onclick="resolveAlert('${a.type}', 'half_day', '${a.log_id}', null, event)">Half Day</button>
            <button class="btn-resolve danger" onclick="resolveAlert('${a.type}', 'absent', '${a.log_id}', null, event)">Absent</button>
          `;
        } else if (a.type === 'abandoned_checkin') {
          actions = `
            <button class="btn-resolve primary" onclick="resolveAlert('${a.type}', 'force_checkout', '${a.log_id}', null, event)">Force Checkout</button>
            <button class="btn-resolve warning" onclick="resolveAlert('${a.type}', 'mark_half_day', '${a.log_id}', null, event)">Half Day</button>
            <button class="btn-resolve danger" onclick="resolveAlert('${a.type}', 'mark_absent', '${a.log_id}', null, event)">Absent</button>
          `;
        } else if (a.type === 'unusual_activity') {
          actions = `
            <button class="btn-resolve secondary" onclick="resolveAlert('${a.type}', 'dismiss', null, '${a.teacher_id}', event)">Dismiss</button>
          `;
        }

        const iconStyle = alertStyles[a.type] || 'info';
        
        return `
        <tr>
          <td style="font-size:12px; color:var(--text-muted)">${formatDt(a.timestamp)}</td>
          <td>
            <div style="display:flex; align-items:center;">
              <div class="alert-icon ${iconStyle}">
                ${alertIcons[a.type] || alertIcons.info}
              </div>
              <span style="font-weight:600">${escHtml(a.title)}</span>
            </div>
          </td>
          <td><strong>${escHtml(a.teacher_name)}</strong></td>
          <td style="font-size:13px; line-height:1.4">${escHtml(a.description)}</td>
          <td>
            <div class="alert-actions">
              ${actions}
            </div>
          </td>
        </tr>
      `}).join('');
    }

    async function resolveAlert(type, action, logId, teacherId, event) {
      if (event && event.target) {
        event.target.textContent = '...';
        event.target.disabled = true;
      }
      
      const payload = { type, action };
      if (logId) payload.log_id = logId;
      if (teacherId) payload.teacher_id = teacherId;

      const data = await api('/admin/alerts/resolve', 'POST', payload);
      if (data) {
        showToast(data.message || "Alert resolved");
        loadAlerts();
      } else {
        if (event && event.target) {
          event.target.disabled = false;
          event.target.textContent = 'Retry';
        }
      }
    }

    initApp('alerts', loadAlerts);
  </script>
</body>
</html>
