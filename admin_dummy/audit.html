    @keyframes pulse {

      }
      70% {
        transform: scale(1);
        box-shadow: 0 0 0 5px rgba(16, 185, 129, 0);
      }
      100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
      }

    /* Proportional columns for Audit Logs */
    .data-table th:nth-child(1), .data-table td:nth-child(1) { width: 15%; } /* Timestamp */
    .data-table th:nth-child(2), .data-table td:nth-child(2) { width: 14%; } /* Admin ID */
    .data-table th:nth-child(3), .data-table td:nth-child(3) { width: 16%; } /* Action */
    .data-table th:nth-child(4), .data-table td:nth-child(4) { width: 55%; } /* Details */

      border-radius: 4px;

      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Row Hover Interaction */
    .data-table tr {
      transition: background-color 0.2s ease;
    }

  <script>
    async function loadAuditLogs() {
      const data = await api('/admin/logs');
      if (!data) return;

      const tbody = document.getElementById('audit-tbody');
      
      if (!data.length) {
        tbody.innerHTML = '<tr><td colspan="4" class="td-loading">No audit records found.</td></tr>';
        return;
      }

      const actionColors = {
        LOGIN:            'purple',
        CREATE_ADMIN:     'success',
        DELETE_ADMIN:     'error',
        ADD_TEACHER:      'success',
        DELETE_TEACHER:   'error',
        UPDATE_TEACHER:   'primary',
        UPDATE_SETTINGS:  'warning',
        UPDATE_LEAVES:    'primary',
      };

      tbody.innerHTML = data.map(log => {
        const detailsHtml = renderDetails(log.details);
        const actionKey   = (log.action || '').toUpperCase().replace(/ /g, '_');
        const badgeType   = actionColors[actionKey] || 'neutral';
        const actionLabel = log.action.replace(/_/g, ' ');
        return `
        <tr>
          <td><span class="timestamp-code">${formatDt(log.timestamp)}</span></td>
          <td><span class="reg-id-code">${escHtml(log.admin_reg_no)}</span></td>
          <td><span class="badge badge--${badgeType}">${escHtml(actionLabel)}</span></td>
          <td style="font-size:13px; color:var(--text-muted); line-height:1.6; white-space:normal; word-break:break-word;">${detailsHtml}</td>
        </tr>`;
      }).join('');
    }

    // ── Rendering helpers ──────────────────────────────────────────────────────

    // Try to parse a Python-style dict string like {'k': 'v', 'n': 3}
    function parsePyDict(s) {
      if (!s) return null;
      s = s.trim();
      if (!s.startsWith('{') || !s.endsWith('}')) return null;
      try {
        let json = s
          .replace(/'/g, '"')
          .replace(/:\s*True\b/g, ': true')
          .replace(/:\s*False\b/g, ': false')
          .replace(/:\s*None\b/g, ': null');
        return JSON.parse(json);
      } catch(e) { return null; }
    }

    // A coloured pill for a value
    function valPill(v) {
      const s = v === null ? 'None' : String(v);
      return `<span style="font-family:monospace; background:rgba(99,102,241,0.15); color:var(--primary); padding:2px 8px; border-radius:4px; font-size:12px;">${escHtml(s)}</span>`;
    }

    // One row: FIELD_NAME  [old] → [new]
    function diffRow(field, oldVal, newVal) {
      const arrow = `<span style="color:var(--purple); font-weight:bold; margin:0 6px; font-size:14px;">→</span>`;
      const label = `<span style="font-size:11px; font-weight:600; color:var(--text-muted); letter-spacing:0.5px; text-transform:uppercase; min-width:180px; display:inline-block;">${escHtml(field)}</span>`;
      const from  = (oldVal !== undefined && oldVal !== null && oldVal !== '') ? valPill(oldVal) + arrow : '';
      return `<div style="display:flex; align-items:center; gap:4px; padding:5px 2px; border-bottom:1px solid rgba(255,255,255,0.04);">${label}${from}${valPill(newVal)}</div>`;
    }

    // Render one setting change value (may be "old -> new" string or scalar)
    function renderChange(key, valStr) {
      if (!valStr && valStr !== 0) return diffRow(key, undefined, valStr);

      const arrowIdx = valStr.indexOf(' -> ');
      if (arrowIdx === -1) {
        // No arrow — simple new value or info string
        return diffRow(key, undefined, valStr);
      }

      const oldStr = valStr.substring(0, arrowIdx).trim();
      const newStr = valStr.substring(arrowIdx + 4).trim();

      const oldDict = parsePyDict(oldStr);
      const newDict = parsePyDict(newStr);

      if (oldDict && newDict) {
        // Both are dicts — show only keys that changed
        let rows = '';
        const allKeys = new Set([...Object.keys(oldDict), ...Object.keys(newDict)]);
        allKeys.forEach(k => {
          const ov = oldDict[k];
          const nv = newDict[k];
          if (JSON.stringify(ov) !== JSON.stringify(nv)) {
            rows += diffRow(`${key}  ›  ${k}`, ov, nv);
          }
        });
        return rows || diffRow(key, oldStr, newStr);
      }

      // Scalar old -> new
      return diffRow(key, oldStr, newStr);
    }

    function renderDetails(details) {
      if (!details) return '<span style="color:var(--text-muted);">—</span>';

      let parsed = details;
      if (typeof details === 'string' && details.startsWith('{')) {
        try {
          parsed = JSON.parse(details);
        } catch (e) {
          return `<span style="font-family:monospace; font-size:11px; color:var(--text-muted);">${escHtml(details)}</span>`;
        }
      }

      if (typeof parsed === 'object' && parsed !== null) {
        let html = '';
        Object.entries(parsed).forEach(([k, v]) => {
          html += renderChange(k, String(v ?? ''));
        });
        return `<div style="padding:2px 0;">${html}</div>`;
      }

      // Plain text (LOGIN success etc.)
      return `<span style="font-size:13px; color:var(--text-muted);">${escHtml(details)}</span>`;
    }

    initApp('audit', loadAuditLogs);
  </script>
