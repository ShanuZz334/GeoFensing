    <!-- Div holding the form -->
    <div id="theFormDiv" class="container" data-toggle="tooltip" title="Click to start the camera" style="display: block; position: relative; cursor: pointer; background-color:lightpink; outline: 2px dashed pink">

    <div class="container">

    </div>

    <script type="text/javascript">
            'use strict';

            $(document).ready(async function() {
                const faceHTML = "<a href='#' class='list-group-item list-group-item-action flex-column align-items-start'>" +
                                    "<blockquote class='blockquote text-left'>" +
                                        "<p class='mb-0'><b>{0}</b></p>" +
                                        "{1}" +
                                    "</blockquote>" +
                                "</a>";
                const fieldsHTML = "<p class='mb-0'>{0}</p>";
                const theForm = document.getElementById("theForm");
                const theFormDiv = document.getElementById("theFormDiv");
                const theResultDiv = document.getElementById("theResultDiv");
                const theCanvasDiv = document.getElementById("theCanvasDiv");
                const theFacesDiv = document.getElementById("theFacesDiv");
                const theLoaderDiv = document.getElementById("theLoaderDiv");
                const theCanvas = document.getElementById("theCanvas");
                const theVideo = document.getElementById("theVideo");
                const theCameraSelect = document.getElementById('theCameraSelect')
                const jsonViewer = document.getElementById("jsonViewer");
                const theLabelClickAction = document.getElementById("theLabelClickAction");
                const elementsAcceptingFileDialogOpen = [theFormDiv, theCanvasDiv]; // Parent divs only (do not mix overlapping controls) to avoid double rise
                const StereoSizes = {
                    main: { width: 1280, height: 720 },
                    aux: { width: 640, height: 480 }
                }
                const states = {
                    initial: "initial",
                    processing: "processing",
                    success: "success",
                    failed: "failed"
                };
                const videoStatues = {
                    ended: 0,
                    paused: 1,
                    playing: 2
                };
                const canvasPosition = {
                    ratio: 1,
                    xoffset: 0,
                    yoffset: 0
                };
                const DISPLAY_FIELDS_NAMES = [
                    'avantgarde_score', 
                    'liveness_code', 'liveness_score', 'liveness_hint', 'liveness_warn',
                    'disguise_score',
                    'deepfake_score',
                    'inject_code', 'inject_score', 'inject_scores', 'inject_occupancies', 'inject_sizes', 'inject_drift', 'inject_focal_length', 'inject_motion', 'inject_similarity', 'inject_avantgarde', 'inject_aggressive_mode', 'inject_warn',
                    'face_detection', 'face_size'
                ];
                let cameraDevices = [];
                let theVideoStatus = videoStatues.ended;
                let attachedFiles = null;
                let currentState = states.initial;

                function clearCanvas() {
                    let ctx = theCanvas.getContext('2d');
                    ctx.clearRect(0, 0, theCanvas.width, theCanvas.height);
                    ctx.rect(0, 0, theCanvas.width, theCanvas.height);
                    ctx.fillStyle = 'black';
                    ctx.fill();
                }

                function killCamera(quiet) {
                    if (theVideoStatus != videoStatues.ended) {
                        if (!quiet) {
                            changeState(states.processing, "Stoping cameras...");
                        }
                        stopCamera();
                        if (!quiet) {
                            changeState(states.success, "Stopped camera");
                        }
                        theVideoStatus = videoStatues.ended;
                    }
                }

                function isCameraActive() {
                    return (window.localStream && theVideoStatus !== videoStatues.ended);
                }

                async function initCameraSelection(forceLoad) {
                    let selectedCamera = window.localStorage.getItem('camera');
                    if (selectedCamera || forceLoad) {
                        const oldVideoStatus = theVideoStatus;
                        killCamera();
                        changeState(states.processing, "Requesting permission to access the camera ...");
                        const error_message = await requestCameraPermission();
                        if (error_message) {
                            changeState(states.failed, "Requesting permission to access the camera failed:[" + error_message+"]");
                            return;
                        }
                        changeState(states.processing, "Listing available cameras...");
                        cameraDevices = await loadCameraDevices();
                        $('#theCameraSelect option:not(:first)').remove();
                        loadCameraDevicesToSelect(cameraDevices, theCameraSelect);
                        let found_camera = false;
                        for (var i = 1; i < theCameraSelect.options.length && !found_camera; i++) {
                            if (found_camera = (theCameraSelect.options[i].value == selectedCamera)) {
                                theCameraSelect.options[i].selected = true;
                            }
                        }
                        if (selectedCamera && !found_camera) {
                            window.localStorage.removeItem('camera');
                        }
                        if (selectedCamera && found_camera && oldVideoStatus != videoStatues.ended) {
                            changeState(states.processing, "Stating the camera ...");
                            playCamera(theVideo, { deviceId: selectedCamera, desiredResolution: StereoSizes['main'] });
                        }
                        else {
                            theLabelClickAction.innerHTML = "Click to start the camera";
                            changeState(cameraDevices.length > 0 ? states.initial : states.failed, "Done listing cameras");
                        }
                    }
                }

                function base64Undress(bases64) {
                    // remove 'data:image/png;base64,'
                    return bases64.replace("data:", "").replace(/^.+,/, "");
                }
                function toBase64(url_string, callback) {
                    var xhr = new XMLHttpRequest();
                    xhr.onload = function() {
                        var reader = new FileReader();
                        reader.onloadend = function() {
                            changeState(states.success, 'Downloaded sample');
                            callback(reader.result, xhr.response);
                        }
                        reader.readAsDataURL(xhr.response);
                    };
                    xhr.onerror = function(e) {
                        changeState(states.failed, 'Failed to download [' + url_string + ']');
                    };
                    changeState(states.processing, 'Downloading sample...');
                    xhr.open('GET', url_string);
                    xhr.responseType = 'blob';
                    xhr.send();                                  
                }

                function triggerFormSubmit() {
                    var event = document.createEvent( 'HTMLEvents' );
                    event.initEvent( 'submit', true, true );

                    const isFromCamera = (attachedFiles.length == 2);
                    event.file = attachedFiles[0];
                    if (isFromCamera) {
                        theForm.dispatchEvent( event );
                    }
                    else {
                        if ((typeof attachedFiles[0] === 'string' || attachedFiles[0] instanceof String)) { // is link
                            toBase64(attachedFiles[0], function(base64, data) {
                                    if (!checkSize(data)) {
                                        changeState(states.failed, 'File too large');
                                        return;
                                    }
                                    event.base64 = base64;
                                    event.file = data;
                                    event.url = attachedFiles[0];
                                    theForm.dispatchEvent( event );
                            })
                        }
                        else { // else is a File Object or Blob
                            event.formData = new FormData();
                            event.formData.append('file', event.file, event.file.name);
                            theForm.dispatchEvent( event );
                        }
                    }
                }
                
                function changeState(state, description) {
                    $("#theForm :input").prop('disabled', (state === states.processing));
                    theLoaderDiv.style.display = (state === states.processing) ? "block" : "none";
                    labelProcessing.style.display = (state === states.initial) ? "none" : "block";
                    if (state === states.initial) {
                        resetDisplay();

                        theFormDiv.style.display = "block";
                        theResultDiv.style.display = "none";
                    }
                    else if (state === states.processing) {
                        resetDisplay();

                        labelProcessing.innerHTML = (description || "Processing...");

                        theFormDiv.style.display = "none";
                        theResultDiv.style.display = "block";
                    }
                    else if (state === states.success) {
                        theForm.reset();
                        if (description !== undefined) {
                            labelProcessing.innerHTML = description;
                        }
                    }
                    else if (state === states.failed) {
                        theForm.reset();
                        labelProcessing.innerHTML = (description || "Failed") + ". Press inside the pink box to <a id='tryAgain' href='#'>try again</a>.";
                    }
                    currentState = state;
                }
                function resetDisplay() {
                    theFacesDiv.innerHTML = "";
                    jsonViewer.innerHTML = "";
                }

                function renderResult(ctx, result) {
                    ctx.save();

                    var text = result.inject_code || 'e_null';
                    if (result.inject_score) {
                        text += "("+result.inject_score.toFixed(2)+"%)";
                    }
                    if (result.inject_warn) {
                        text += " -- " + result.inject_warn;
                    }
                    ctx.font = "bold 30pt FontOCRB";
                    ctx.strokeStyle = (result.inject_code == 's_inject') ? 'violet' : (result.inject_code == 's_impaired' ? 'coral' : (result.inject_code == 's_challenge' ? 'darkorange' : (result.inject_code == 's_genuine' ? 'green' : 'red')));
                    
                    const textWidth = ctx.measureText(text).width;
                    const halfStrokeWidth = ctx.lineWidth * 0.5;
                    const textSize = { width: textWidth, height: textWidth / (text.length * 0.57) };

                    ctx.fillStyle = ctx.strokeStyle;
                    ctx.fillRect(0, 0, textSize.width + ctx.lineWidth*2, textSize.height + halfStrokeWidth*2);

                    ctx.fillStyle = "black";
                    ctx.fillText(text, 0, textSize.height); 

                    ctx.restore();
                }

                function renderFace(ctx, face) {
                    var warpedBox = extractScaledWarpedBox(face.warpedBox, canvasPosition);
                    const code = face.inject_code || face.liveness_code;
                    ctx.strokeStyle = (code == 's_spoof')
                    ? 'red'
                    : (code == 's_genuine' ? 'green' : (code == 's_disputed' ? 'orange' : (code == 's_disguise' ? 'pink' : (code == 's_deepfake' ? 'chocolate' : (code == 's_inject' ? 'violet' : (code == 's_impaired' ? 'coral' : (code == 's_challenge' ? 'darkorange' : 'yellow')))))));
                    ctx.setLineDash(code == 'e_back' ? [5, 3] : []); // solid lines for front and dashed for back
                    ctx.lineWidth = (code == 'e_back' || code == 'e_small') ? 2 : 5;
                    drawWarpedBox(ctx, warpedBox);

                    // Draw landmarks
                    if (face.landmarks && face.landmarks.length > 0 && face.landmarks[0].type === '2d5') {
                        ctx.fillStyle = ctx.strokeStyle;
                        var recsize = (code == 'e_back') ? 3 : 7;
                        var landmarks = extractScaledWarpedBox(face.landmarks[0].values, canvasPosition);
                        for (var i = 0; i < landmarks.length; i += 2) {
                            ctx.fillRect(landmarks[i], landmarks[i + 1], recsize, recsize);
                        }
                    }

                    // Draw description for the main face
                    if (code !== 'e_back') {
                        var texts = [
                            { text: typeof face.liveness_score !== 'undefined' ? 'Liveness' : null, score: face.liveness_score }, // [0]-Liveness
                            { text: face.inject_warn || face.liveness_warn || face.liveness_hint || null }, // [1]-Hint/warn
                            { text: typeof face.disguise_score !== 'undefined' ? 'Concealment' : null, score: face.disguise_score }, // [2]-Disguise
                            { text: typeof face.deepfake_score !== 'undefined' ? 'Deepfake' : null, score: face.deepfake_score }, // [3]-Deepfake
                            { text: typeof face.inject_score !== 'undefined' ? 'Inject' : null, score: face.inject_score }, // [4]-Inject
                            { text: code.substring(2, code.length) }, // [5]-Final result
                        ];
                        // Draw texts
                        for (var i = 0; i < texts.length; ++i) {
                            var text = texts[i].text;
                            if (!text) {
                                continue;
                            }
                            if (typeof texts[i].score !== 'undefined') {
                                text += ' (' + texts[i].score.toFixed(2) + '%)';
                            }
                            if (i == 1) {
                                text = (typeof face.liveness_hint !== 'undefined' ? 'hint: ' : 'warn: ') + text;
                            }
                            ctx.font = (i == 5 || i == 1) ? "bold 20pt FontOCRB" : "15pt FontOCRB";
                            var textWidth = ctx.measureText(text).width;
                            var textSize = { width: textWidth, height: textWidth / (text.length * 0.57) };
                            var halfStrokeWidth = ctx.lineWidth * 0.5;
                            var textPos = { 
                                x: (i == 3) ? warpedBox[2] : warpedBox[0], 
                                y: (i == 0) 
                                    ? (warpedBox[1] - ctx.lineWidth) 
                                    : ((i == 1) 
                                        ? (warpedBox[7] - ctx.lineWidth + textSize.height) 
                                        : ((i == 5) 
                                            ? (warpedBox[1] - textSize.height)
                                            : (warpedBox[7])
                                            ))
                            };

                            ctx.save();
                            if (i == 2 || i == 3) { // 2:disguise, 3:deepfake
                                // disguise or deepfake
                                var xoffset = (i == 3) ? textSize.height : 0;
                                ctx.translate(textPos.x + xoffset, textPos.y);
                                ctx.rotate(-Math.PI/2);

                                ctx.fillStyle = ctx.strokeStyle;
                                ctx.fillRect(-halfStrokeWidth, -textSize.height, textSize.width + ctx.lineWidth*2, textSize.height + halfStrokeWidth);

                                ctx.fillStyle = "blue";
                                ctx.fillText(text, 0, 0);                           
                            }
                            else {
                                var yoffset = (i == 4) ? -ctx.lineWidth : 0;
                                var xoffset = (i == 4) ? ctx.lineWidth : 0;
                                ctx.translate(xoffset, yoffset);

                                ctx.fillStyle = (i == 1 && text.includes('warn')) ? "red" : ctx.strokeStyle;
                                ctx.fillRect(textPos.x - halfStrokeWidth, textPos.y - textSize.height + halfStrokeWidth, textSize.width + ctx.lineWidth*2, textSize.height + halfStrokeWidth);

                                ctx.fillStyle = (i == 1 || i == 5) ? "black" : "blue";
                                ctx.fillText(text, textPos.x, textPos.y);
                            }
                            ctx.restore();
                        }
                    }

                     // Build HTML elements of the fields
                    var fieldsString = "<ul>";
                    DISPLAY_FIELDS_NAMES.forEach(function(name) {
                        if (name === 'face_size' || typeof face[name] !== 'undefined') {
                            fieldsString += ((name == 'face_size') 
                                ? "<li class='mb-0'>" + escapeHtml(name) + ":&nbsp;<b style='font-family:FontOCRB;'>("+ Math.round(face.warpedBox[2]-face.warpedBox[0]) + ' per ' + Math.round(face.warpedBox[7]-face.warpedBox[1]) +") px</b></li>"
                                : "<li class='mb-0'>" + escapeHtml(name) + ":&nbsp;<b style='font-family:FontOCRB;'>" + ((typeof face[name] === 'number') ? face[name].toFixed(2) + (name.includes("similarity")?"":"%") : escapeHtml(face[name])) + "</b></li>")
                                ;
                        }
                    });
                    fieldsString += "</ul>";
                    theFacesDiv.insertAdjacentHTML( 'beforeend', 
                        formatString(faceHTML, escapeHtml('Face'), 
                            formatString(fieldsHTML, fieldsString)
                        )
                    );                
                }

                // Thumbnails are reduced (lowres) images and MUST not be used for testing.
                // Disable right-click to force the user to use highres images
                $('img').bind('contextmenu', function(e) {
                    return false;
                }); 

                // Load cameras if requested
                await initCameraSelection(false/*force-load*/);

                // Signal initial state
                changeState(states.initial);

                // Set canvas size
                {   /* https://developer.mozilla.org/en-US/docs/Web/API/Window/devicePixelRatio */
                    // Set display size (css pixels).
                    var oldDisplay = theResultDiv.style.display;
                    theResultDiv.style.display = "block"; // display
                    theCanvas.style.width = theCanvasDiv.offsetWidth + "px";
                    theCanvas.style.height = theCanvasDiv.offsetHeight + "px";

                    // Set actual size in memory (scaled to account for extra pixel density).
                    var scale = (window.devicePixelRatio || 1);
                    theCanvas.width = theCanvasDiv.offsetWidth * scale;
                    theCanvas.height = theCanvasDiv.offsetHeight * scale;
                    theResultDiv.style.display = oldDisplay;
                }

                // Camera selection events
                theCameraSelect.addEventListener( 'focusin', async function( e ) {
                    if (currentState != states.processing) {
                        if (cameraDevices.length == 0) {
                            await initCameraSelection(true/*force-load*/);
                        }
                    }
                });
                theCameraSelect.addEventListener( 'change', async function( e ) {
                    if (currentState != states.processing) {
                        if (theCameraSelect.selectedIndex == 0) {
                            killCamera();
                            window.localStorage.removeItem('camera');
                            theLabelClickAction.innerHTML = "Click to start the camera";
                            changeState(states.initial, "Disabled camera use");
                        }
                        else {
                            window.localStorage.setItem('camera', theCameraSelect.value);
                            await initCameraSelection(true/*force-load*/);
                        }
                    }
                });

                // Video events
                theVideo.onplaying = function () {
                    theVideoStatus = videoStatues.playing;
                    clearCanvas();
                    changeState(states.success, "Press inside the pink box to take a picture");
                    function drawFrame() {
                        if (theVideoStatus == videoStatues.playing) {
                            drawImageScaled(theVideo, theCanvas.getContext('2d'), canvasPosition);
                        }
                        window.requestAnimationFrame(drawFrame);
                    }
                    drawFrame();
                };
                theVideo.onended = function() { 
                    console.log('Camera stopped');
                    theVideoStatus = videoStatues.ended; 
                };
                theVideo.onpause = function() { 
                    console.log('Camera paused');
                    theVideoStatus = videoStatues.paused; 
                };
    
                // Open the file dialog when the div holding the form is clicked
                // Or, open camera stream if a camera is selected
                elementsAcceptingFileDialogOpen.forEach(function( element ) {
                    element.addEventListener( 'click', function( e ) {
                        if (currentState != states.processing) {
                            if (theCameraSelect.selectedIndex == 0) {
                                changeState(states.failed, "You must select a camera first");
                                return;
                            }
                            
                            if (!isCameraActive()) {
                                changeState(states.processing, "Starting the camera ...");
                                playCamera(theVideo, { deviceId: theCameraSelect.selectedOptions[0].value, desiredResolution: StereoSizes['main'] });
                            }
                            else if (theVideoStatus == videoStatues.playing) {
                                changeState(states.processing, "Taking a stereo picture [0/2] ...");
                                // pause camera before grabbing main image
                                theVideo.pause();
                                // grab main image:
                                //      don't use 'theCanvas'(preview) because it's resized to match aspect ratio of the window
                                //      and contains drawings
                                changeState(states.processing, "Taking a stereo picture [1/2] ...");
                                let canvas = document.createElement('canvas');
                                canvas.width = theVideo.videoWidth;
                                canvas.height = theVideo.videoHeight;
                                canvas.getContext('2d').drawImage(theVideo, 0, 0);
                                const url_main = canvas.toDataURL();
                                // convert main url to base64 and add to attached files
                                attachedFiles = [url_main];
                                // free the camera to allow taking the aux
                                killCamera(true/*quiet*/);
                                // take aux image
                                takeAuxImage({ deviceId: theCameraSelect.selectedOptions[0].value, desiredResolution: StereoSizes['aux'] }).then(function(blob_aux) {
                                    changeState(states.processing, "Taking a stereo picture [2/2] ...");
                                    // draw aux image at the top/left
                                    const aux_tile_size = Math.max(theCanvas.width, theCanvas.height) / 10;
                                    createImageBitmap(blob_aux).then(bitmap => {
                                        theCanvas.getContext('2d').drawImage(bitmap, theCanvas.width - aux_tile_size, 0, aux_tile_size, aux_tile_size * bitmap.height / bitmap.width);
                                    });
                                    // convert aux image to base64 and add to attached files
                                    let reader_aux = new FileReader(); 
                                    reader_aux.onloadend = function() {
                                        attachedFiles.push(reader_aux.result); // data_url
                                        // reCAPTCHA then submit images (main and aux)
                                        changeState(states.processing, "Submiting stereo images ...");
                                        triggerFormSubmit();
                                    }
                                    reader_aux.readAsDataURL(blob_aux);
                                })
                                .catch(function(err) {
                                    changeState(states.failed, "Failed to take aux image:" + err);
                                });
                            }
                            else if (theVideoStatus == videoStatues.paused) {
                                changeState(states.processing, "Resuming the camera ...");
                                theVideo.play();
                                changeState(states.success, "Press on the image to take a picture");
                            }
                            
                        }
                    });
                });

                // if the form was submitted
                theForm.addEventListener( 'submit', function( e ) {
                    e.preventDefault();
                    e.stopPropagation();

                    loadImage(
                        e.file,
                        function(img, data) {
                            if (img.type === "error") {
                                alert("Error loading image " + e.file);
                                return;
                            }

                            // Reset context
                            var ctx = theCanvas.getContext("2d");
                            ctx.setTransform(1, 0, 0, 1, 0, 0);
                            ctx.lineWidth = 3.0;
                            ctx.imageSmoothingQuality = "high";
                            ctx.imageSmoothingEnabled = true;
    
                            // Send data
                            $.ajax({
                                url: 'http://localhost:9100',
                                data: JSON.stringify({ 'main':base64Undress(attachedFiles[0]), 'aux':base64Undress(attachedFiles[1]), 'type':'image/png' }),
                                type: 'POST',
                                dataType: 'json', // always excepting json as result
                                cache: false,
                                contentType: 'application/json; charset=utf-8',
                                processData: false,
                                beforeSend: function () {
                                    changeState(states.processing, "Preparing to send...");
                                },
                                success: function (jsonData) {
                                    var node = new PrettyJSON.view.Node({ 
                                            el:jsonViewer, 
                                            data:jsonData
                                    });
                                    var faces = jsonData.faces || [];
                                    if (faces.length > 0) {
                                        for (var i = 0; i < faces.length; ++i) {
                                            renderFace(ctx, faces[i]);
                                        }
                                    }
                                    else {
                                        renderResult(ctx, jsonData);
                                    }
                                    var successInfo = "Computing time: <b>"+jsonData.duration+" milliseconds</b>. "
                                                                     + "Press inside the pink box to resume the camera and <a id='tryAgain' href='#'>try again</a>";
                                    changeState(states.success, successInfo);
                                },
                                error: function (jqXHR, textStatus, errorThrown) {
                                    alert(textStatus + ': ' + errorThrown);
                                    changeState(states.failed, textStatus);
                                },
                                xhr: function() {
                                    var xhr = new window.XMLHttpRequest();
                                    xhr.upload.onprogress = function(evt) { 
                                        if (evt.lengthComputable) {
                                            var percentage = Math.floor((evt.loaded / evt.total) * 100);
                                            changeState(states.processing, "Uploading (<b>"+percentage+"%</b>)...");
                                        }
                                    };
                                    xhr.upload.onload = function() { 
                                        changeState(states.processing, "Computing...");
                                    };
                                    return xhr;
                                }
                            });
                        },
                        {
                            orientation: true // Transform the canvas according to the specified Exif orientation
                        }
                    );

                    return false;			
                });
            });
    </script>
    
</body>

</html>
