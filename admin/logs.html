<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoFace Admin — Attendance Logs</title>
  <link rel="stylesheet" href="css/styles.css?v=2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <aside class="sidebar" id="sidebar">

        </svg>
      </div>
      <span>GeoFace</span>
    </div>
    <nav class="sidebar-nav">
      <a href="index.html" class="nav-item" id="nav-dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z"/>
        </svg>
        Dashboard
      </a>
      <a href="teachers.html" class="nav-item" id="nav-teachers">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z"/>
        </svg>
        Teachers
      </a>
      <a href="logs.html" class="nav-item active" id="nav-logs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25zM6.75 12h.008v.008H6.75V12zm0 3h.008v.008H6.75V15zm0 3h.008v.008H6.75V18z"/>
        </svg>
        Attendance Logs
      </a>
      <a href="map.html" class="nav-item" id="nav-map">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M9 6.75V15m6-6v8.25m.503-3.46c.453-.172.806-.5 1.026-.915a2.25 2.25 0 00-.834-2.923c-.426-.258-.87-.492-1.32-.7l-.156-.07a2.25 2.25 0 01-1.055-1.94V4.5c0-.621-.504-1.125-1.125-1.125h-3c-.621 0-1.125.504-1.125 1.125v1.233c0 .822-.443 1.577-1.157 1.986l-.117.067a2.25 2.25 0 01-1.2 2.01c-.266.136-.534.275-.802.417a2.25 2.25 0 00-.81 3.01c.25.438.613.79 1.06 1.02a2.25 2.25 0 011.023 1.94V19.5c0 .621.504 1.125 1.125 1.125h3c.621 0 1.125-.504 1.125-1.125v-1.233c0-.822.443-1.577 1.157-1.986l.117-.067a2.25 2.25 0 011.2-2.01z"/>
        </svg>
        Geofence Map
      </a>
    </nav>
    <div class="sidebar-footer">
      <button class="btn-signout" onclick="adminSignOut()">Sign Out</button>
    </div>
  </aside>

  <main class="main-content">
    <header class="page-header">
      <div>
        <h1 class="page-title">Attendance Logs</h1>
        <p class="page-subtitle">All verification attempts</p>
      </div>
    </header>

    <!-- Filters -->
    <div class="filter-bar">
      <select id="filter-status" class="filter-select" onchange="applyFilters()">
        <option value="">All statuses</option>
        <option value="success">Success</option>
        <option value="failure">Failure</option>
      </select>
      <input type="date" id="filter-date-from" class="filter-input" onchange="applyFilters()" />
      <input type="date" id="filter-date-to" class="filter-input" onchange="applyFilters()" />
      <button class="btn-secondary" onclick="resetFilters()">Clear</button>
    </div>

    <div class="table-wrapper">
      <table class="data-table" id="logs-table">
        <thead>
          <tr>
            <th>Teacher</th>
            <th>Email</th>
            <th>Timestamp</th>
            <th>Status</th>
            <th>Reason</th>
            <th>Location</th>
            <th>Frames</th>
          </tr>
        </thead>
        <tbody id="logs-tbody">
          <tr><td colspan="7" class="td-loading">Loading logs…</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div class="pagination" id="pagination">
      <button class="btn-secondary" id="prev-btn" onclick="changePage(-1)" disabled>← Prev</button>
      <span id="page-info">Page 1</span>
      <button class="btn-secondary" id="next-btn" onclick="changePage(1)">Next →</button>
    </div>
  </main>

  <!-- Login Modal (shared) -->
  <div class="modal-overlay" id="login-modal">
    <div class="modal-card">
      <div class="modal-logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/>
          </svg>
        </div>
        <span>GeoFace Admin</span>
      </div>
      <h2 class="modal-title">Sign in to continue</h2>
      <div id="login-error" class="error-banner" style="display:none;"></div>
      <div class="form-group">
        <label for="admin-email">Email</label>
        <input type="email" id="admin-email" placeholder="admin@college.edu" />
      </div>
      <div class="form-group">
        <label for="admin-password">Password</label>
        <input type="password" id="admin-password" placeholder="••••••••" />
      </div>
      <button class="btn-primary btn-full" id="btn-login" onclick="adminLogin()">Sign In</button>
    </div>
  </div>

  <script src="js/api.js?v=1001"></script>
  <script src="js/app.js"></script>
  <script>
    let currentPage = 1;
    function applyFilters() { currentPage = 1; loadLogs(); }
    function resetFilters() {
      document.getElementById('filter-status').value = '';
      document.getElementById('filter-date-from').value = '';
      document.getElementById('filter-date-to').value = '';
      applyFilters();
    }
    function changePage(dir) {
      currentPage += dir;
      loadLogs();
    }
    async function loadLogs() {
      const status = document.getElementById('filter-status').value;
      const from = document.getElementById('filter-date-from').value;
      const to = document.getElementById('filter-date-to').value;
      const params = new URLSearchParams({ page: currentPage, per_page: 25 });
      if (status) params.set('status', status);
      if (from) params.set('date_from', from);
      if (to) params.set('date_to', to);

      const data = await api(`/admin/attendance?${params}`);
      if (!data) return;

      document.getElementById('page-info').textContent =
        `Page ${data.page} of ${data.pages}`;
      document.getElementById('prev-btn').disabled = data.page <= 1;
      document.getElementById('next-btn').disabled = data.page >= data.pages;

      const tbody = document.getElementById('logs-tbody');
      if (!data.logs.length) {
        tbody.innerHTML = '<tr><td colspan="7" class="td-loading">No records found</td></tr>';
        return;
      }
      tbody.innerHTML = data.logs.map(log => `
        <tr>
          <td>${escHtml(log.teacher_name || '—')}</td>
          <td style="color:var(--text-muted);font-size:12px">${escHtml(log.teacher_id.slice(0,8))}…</td>
          <td>${formatDt(log.timestamp)}</td>
          <td><span class="badge badge--${log.status}">${log.status}</span></td>
          <td style="max-width:220px;white-space:normal">${escHtml(log.reason)}</td>
          <td style="font-size:12px">${log.latitude ? log.latitude.toFixed(4) + ', ' + log.longitude.toFixed(4) : '—'}</td>
          <td style="text-align:center">${log.frames_count ?? '—'}</td>
        </tr>
      `).join('');
    }
    initApp('logs');
    loadLogs();
  </script>
</body>
</html>
