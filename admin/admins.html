  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    @keyframes pulse {
      0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      }
      70% {
        transform: scale(1);
        box-shadow: 0 0 0 5px rgba(16, 185, 129, 0);
      }
      100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
      }
    }

    /* Proportional columns for Manage Admins */
    .data-table th:nth-child(1), .data-table td:nth-child(1) { width: 15%; } /* Reg ID */
    .data-table th:nth-child(2), .data-table td:nth-child(2) { width: 35%; } /* Name */
    .data-table th:nth-child(3), .data-table td:nth-child(3) { width: 18%; } /* Role */
    .data-table th:nth-child(4), .data-table td:nth-child(4) { width: 22%; } /* Registered */
    .data-table th:nth-child(5), .data-table td:nth-child(5) { width: 10%; text-align: right; } /* Actions */

    /* Monospace Reg ID style */
    .reg-id-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      padding: 3px 6px;
      border-radius: 4px;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .reg-id-code.me-badge {
      border-color: rgba(139, 92, 246, 0.4);
      background: rgba(139, 92, 246, 0.08);
      color: #c084fc;
      font-weight: 600;
    }

    /* Tabular Timestamp style */
    .timestamp-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Polished delete action button without boxing */
    .btn-delete-admin {
      background: transparent;
      border: none;
      color: #f87171;
      padding: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-delete-admin:hover:not(:disabled) {
      color: #ef4444;
      transform: scale(1.15);
    }

    .btn-delete-admin:disabled {
      opacity: 0.25;
      cursor: not-allowed;
      color: var(--text-muted);
    }

    /* Row Hover Interaction */
    .data-table tr {
      transition: background-color 0.2s ease;
    }

    /* Role text style without capsule */
    .data-table .role-text {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .data-table .role-text--purple {
      color: #c084fc;
    }

    .data-table .role-text--neutral {
      color: #94a3b8;
    }
  </style>
</head>

  <script>
    let currentAdminRegNo = null;

    async function loadAdmins() {
      const data = await api('/admin/admins');
      if (!data) return;
      
      // Sort Head Admins always to the top
      data.sort((a, b) => (b.is_head_admin ? 1 : 0) - (a.is_head_admin ? 1 : 0));

      const adminData = getAdminData();
      currentAdminRegNo = adminData ? adminData.reg_no : null;

      const tbody = document.getElementById('admins-tbody');
      tbody.innerHTML = data.map(a => {
        const isMe = a.reg_no === currentAdminRegNo;
        return `
        <tr>
          <td><span class="reg-id-code ${isMe ? 'me-badge' : ''}">${escHtml(a.reg_no)}</span></td>
          <td>
            <div style="display:flex; align-items:center; gap:10px;">
              <img src="${a.profile_pic ? (a.profile_pic.startsWith('data:') ? a.profile_pic : 'data:image/jpeg;base64,' + a.profile_pic) : 'images/default-avatar.svg'}" alt="${escHtml(a.name)}" style="width:32px; height:32px; border-radius:50%; object-fit:cover; background:var(--surface-2); border:1.5px solid rgba(124, 58, 237, 0.2);" onerror="this.src='images/default-avatar.svg'" />
              <strong style="color:var(--text);">${escHtml(a.name)}</strong>
            </div>
          </td>
          <td><span class="role-text ${a.is_head_admin ? 'role-text--purple' : 'role-text--neutral'}">${a.is_head_admin ? 'Head Admin' : 'Admin'}</span></td>
          <td><span class="timestamp-code">${formatDt(a.created_at)}</span></td>
          <td style="text-align: right;">
            <button class="btn-delete-admin" title="Delete Admin" onclick="deleteAdmin('${a.id}', '${escHtml(a.name)}')" ${isMe ? 'disabled' : ''}>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path><line x1="10" x2="10" y1="11" y2="17"></line><line x1="14" x2="14" y1="11" y2="17"></line></svg>
            </button>
          </td>
        </tr>
      `}).join('');
    }

    function toggleHeadAdminAuth() {
      const isHead = document.getElementById('reg-is-head').checked;
      document.getElementById('head-admin-auth').style.display = isHead ? 'block' : 'none';
      if (!isHead) document.getElementById('reg-head-password').value = '';
    }

    function showRegisterModal() {
      document.getElementById('reg-name').value = '';
      document.getElementById('reg-no').value = '';
      document.getElementById('reg-password').value = '';
      document.getElementById('reg-is-head').checked = false;
      document.getElementById('reg-head-password').value = '';
      toggleHeadAdminAuth();
      
      document.getElementById('register-error').style.display = 'none';
      document.getElementById('register-success').style.display = 'none';
      document.getElementById('register-modal').style.display = 'flex';
    }

    function hideRegisterModal() {
      document.getElementById('register-modal').style.display = 'none';
    }

    let currentStream = null;
    let selectedImageBase64 = null;

    function toggleCamera() {
      const video = document.getElementById('reg-camera-preview');
      const img = document.getElementById('reg-pic-preview');
      const icon = document.getElementById('reg-pic-icon');
      const btn = document.getElementById('btn-camera');

      if (currentStream) {
        // Stop camera, capture frame
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        selectedImageBase64 = canvas.toDataURL('image/jpeg', 0.8);
        img.src = selectedImageBase64;

        currentStream.getTracks().forEach(t => t.stop());
        currentStream = null;
        video.style.display = 'none';
        img.style.display = 'block';
        icon.style.display = 'none';
        btn.textContent = '📷 Camera';
      } else {
        // Start camera
        navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
          currentStream = stream;
          video.srcObject = stream;
          video.style.display = 'block';
          img.style.display = 'none';
          icon.style.display = 'none';
          btn.textContent = '📸 Capture';
          selectedImageBase64 = null;
        }).catch(err => {
          console.error(err);
          alert('Could not access camera.');
        });
      }
    }

    function handlePicFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        selectedImageBase64 = ev.target.result;
        const img = document.getElementById('reg-pic-preview');
        const video = document.getElementById('reg-camera-preview');
        const icon = document.getElementById('reg-pic-icon');
        
        if (currentStream) {
          currentStream.getTracks().forEach(t => t.stop());
          currentStream = null;
          document.getElementById('btn-camera').textContent = '📷 Camera';
        }
        
        video.style.display = 'none';
        icon.style.display = 'none';
        img.src = selectedImageBase64;
        img.style.display = 'block';
      };
      reader.readAsDataURL(file);
    }

    async function submitRegister() {
      const name = document.getElementById('reg-name').value.trim();
      const regNo = document.getElementById('reg-no').value.trim();
      const password = document.getElementById('reg-password').value;
      const isHeadAdmin = document.getElementById('reg-is-head').checked;
      const headAdminPassword = document.getElementById('reg-head-password').value;

      const errEl = document.getElementById('register-error');
      const okEl = document.getElementById('register-success');
      errEl.style.display = 'none'; okEl.style.display = 'none';

      if (!name || !regNo || !password) {
        errEl.textContent = 'Name, Reg ID, and Password are required.';
        errEl.style.display = 'block'; return;
      }

      if (isHeadAdmin && !headAdminPassword) {
        errEl.textContent = 'Your Head Admin Password is required to grant head admin privileges.';
        errEl.style.display = 'block'; return;
      }

      const payload = { 
        name, 
        reg_no: regNo, 
        password,
        is_head_admin: isHeadAdmin,
        head_admin_password: headAdminPassword
      };

      if (selectedImageBase64) {
        payload.profile_pic = selectedImageBase64;
      }

      const btn = document.getElementById('btn-register-submit');
      btn.disabled = true;
      btn.textContent = 'Registering...';

      const data = await api('/admin/admins', 'POST', payload);
      
      btn.disabled = false;
      btn.textContent = 'Register Admin';

      if (data) {
        okEl.textContent = `Administrator "${name}" registered successfully!`;
        okEl.style.display = 'block';
        setTimeout(() => { hideRegisterModal(); loadAdmins(); }, 1500);
      }
    }

    async function deleteAdmin(id, name) {
      if (!isCurrentAdminHeadAdmin()) {
        uiAlert("Permission Denied", "Only Head Admins can delete administrators.");
        return;
      }

      const modalHtml = `
        <div id="delete-admin-modal" class="modal-overlay" style="display:flex; z-index: 99999;">
          <div class="modal-card" style="max-width: 400px;">
            <h3 style="margin-bottom: 10px; color: var(--error);">Delete Administrator</h3>
            <p style="margin-bottom: 24px; color: var(--text-muted); line-height: 1.5;">Are you sure you want to permanently delete <strong>${escHtml(name)}</strong>? Enter your Head Admin password to confirm.</p>
            <div class="form-group" style="margin-bottom: 24px;">
              <input type="password" id="delete-admin-password" placeholder="Your Password" style="border-color:var(--error)"/>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 12px;">
              <button id="del-cancel-btn" class="btn-secondary">Cancel</button>
              <button id="del-confirm-btn" class="btn-primary" style="background:var(--error);border-color:var(--error)">Delete Admin</button>
            </div>
          </div>
        </div>
      `;
      document.body.insertAdjacentHTML('beforeend', modalHtml);

      document.getElementById('del-cancel-btn').onclick = () => {
        document.getElementById('delete-admin-modal').remove();
      };

      document.getElementById('del-confirm-btn').onclick = async () => {
        const pwd = document.getElementById('delete-admin-password').value;
        if (!pwd) {
          showToast("Password is required", "error");
          return;
        }

        const btn = document.getElementById('del-confirm-btn');
        btn.disabled = true;
        btn.textContent = 'Deleting...';

        const data = await api(`/admin/admins/${id}`, 'DELETE', { password: pwd });
        if (data) {
          document.getElementById('delete-admin-modal').remove();
          showToast("Administrator removed successfully");
          loadAdmins();
        } else {
          btn.disabled = false;
          btn.textContent = 'Delete Admin';
        }
      };
    }

    initApp('admins', loadAdmins);
  </script>
</body>
</html>
