# ==============================================================================
# Nginx Production Configuration - GeoFace Faculty Authentication System
# ==============================================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;

    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=2r/s;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    upstream flask_api {
        server api:5000;
        keepalive 32;
    }

    # HTTP server (Redirect to HTTPS in production)
    server {
        listen 80;
        listen [::]:80;
        server_name localhost; # Replace with your domain

        # Increase max body size for base64 images/videos
        client_max_body_size 20M;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'; frame-ancestors 'self';" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Redirect root to admin panel
        location = / {
            return 301 /admin/;
        }

        # Admin Panel Static Files
        location ^~ /admin/ {
            alias /usr/share/nginx/html/admin/;
            index index.html;
            try_files $uri $uri/ /admin/index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires 0;
        }

        # Teacher Portal (Flutter Web)
        location ^~ /teacher/ {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /teacher/index.html;

            # Hashed assets (JS/CSS/images) can be cached long-term
            location ~* \.(css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                try_files $uri =404;
            }

            # KILL STUCK SERVICE WORKERS AND HTML/JS CACHE
            location ~* (main\.dart\.js|flutter_service_worker\.js|flutter_bootstrap\.js|index\.html|\.js)$ {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                expires 0;
                try_files $uri =404;
            }

            # HTML and service worker must NEVER be cached
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            expires 0;
        }

        # Redirect exactly /teacher to /teacher/
        location = /teacher {
            return 301 /teacher/;
        }

        # API Proxy
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            
            # Remove /api prefix before passing to Flask if needed
            # Current Flask app seems to root routes at /
            rewrite ^/api/(.*)$ /$1 break;
            
            proxy_pass http://flask_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for face recognition processing
            proxy_connect_timeout 10s;
            proxy_send_timeout    120s;
            proxy_read_timeout    120s;
        }

        # Auth Routes (Stricter Rate Limiting)
        location /api/login {
            limit_req zone=auth_limit burst=5 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://flask_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health Check
        location /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'healthy';
        }

        # Deny access to . files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
