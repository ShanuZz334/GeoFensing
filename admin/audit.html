    <div class="table-wrapper">

        <thead>
          <tr>
            <th style="width: 15%">Timestamp</th>

            <th style="width: 20%">Action</th>

          </tr>
        </thead>

        </tbody>
      </table>
    </div>

  <script src="js/api.js?v=2"></script>
  <script src="js/app.js?v=2"></script>
  <script>
    async function loadAuditLogs() {
      const data = await api('/admin/logs');
      if (!data) return;

      const tbody = document.getElementById('audit-tbody');
      
      if (!data.length) {
        tbody.innerHTML = '<tr><td colspan="4" class="td-loading">No audit records found.</td></tr>';
        return;
      }

      const actionColors = {
        LOGIN:            'purple',
        CREATE_ADMIN:     'success',
        DELETE_ADMIN:     'error',
        ADD_TEACHER:      'success',
        DELETE_TEACHER:   'error',
        UPDATE_TEACHER:   'primary',
        UPDATE_SETTINGS:  'warning',
        UPDATE_LEAVES:    'primary',
      };

      tbody.innerHTML = data.map(log => {
        let detailsHtml = '';
        if (!log.details) {
          detailsHtml = '—';
        } else if (log.details.startsWith('{')) {
          try {
            const parsed = JSON.parse(log.details);
            const flat = {};
            function flatten(obj, prefix) {
              Object.entries(obj).forEach(([k, v]) => {
                const key = prefix ? `${prefix}.${k}` : k;
                if (v && typeof v === 'object' && !Array.isArray(v)) flatten(v, key);
                else flat[key] = v;
              });
            }
            flatten(parsed, '');
            detailsHtml = Object.entries(flat).map(([k, v]) =>
              `<span style="display:inline-block; margin-right:8px; margin-bottom:4px; font-size:11px; padding:2px 6px; background:var(--surface-3); border-radius:4px"><strong>${escHtml(k)}:</strong> ${escHtml(String(v ?? '—'))}</span>`
            ).join('');
          } catch(e) {
            detailsHtml = escHtml(log.details);
          }
        } else {
          // Custom string formatting for "key: {...} -> {...}" Python logs
          let html = escHtml(log.details);
          
          // Bold prefix
          const prefixMatch = html.match(/^([a-zA-Z0-9_]+): /);
          if (prefixMatch) {
            html = html.replace(prefixMatch[0], `<strong style="color:var(--text); text-transform:uppercase; font-size:11px; letter-spacing:0.5px;">${prefixMatch[1]}</strong><br/>`);
          }

          // Format Python dicts
          html = html.replace(/\{([^}]+)\}/g, (match, inner) => {
            let styledInner = inner.replace(/&#39;([^&#]+)&#39;/g, '<span style="color:var(--primary)">\'$1\'</span>');
            return `<div style="background:var(--surface-2); padding:6px 10px; border-radius:6px; font-family:monospace; font-size:11.5px; display:inline-block; margin:4px 0; border:1px solid var(--border); color:var(--text-muted); line-height:1.6;">{ ${styledInner} }</div>`;
          });

          // Style arrow
          html = html.replace(/ -&gt; /g, '<div style="display:inline-block; margin:0 8px; color:var(--purple); font-size:14px; font-weight:bold; vertical-align:middle;">➔</div>');

          detailsHtml = html;
        }

        const actionKey = (log.action || '').toUpperCase().replace(/ /g, '_');
        const badgeType = actionColors[actionKey] || 'neutral';
        const actionLabel = log.action.replace(/_/g, ' ');

        return `
        <tr>
          <td style="font-size:12px; color:var(--text-muted)">${formatDt(log.timestamp)}</td>
          <td><code style="font-size:12px">${escHtml(log.admin_reg_no)}</code></td>
          <td><span class="badge badge--${badgeType}">${escHtml(actionLabel)}</span></td>
          <td style="font-size:13px; line-height:1.4; white-space:normal; word-break:break-word;">${detailsHtml}</td>
        </tr>
      `}).join('');
    }

    initApp('audit', loadAuditLogs);
  </script>
